name: Auto-merge build branch into main

# Moshe's build sessions push to claude/* branches; this keeps main (the
# deployed branch on Railway) up to date automatically. Merges are clean by
# construction: main only adds files those branches never touch
# (server.js, bm-sync.js, package.json, site/, .github/).
on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge pushed branch into main
        run: |
          git config user.name "automerge-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git merge --no-edit "origin/$GITHUB_REF_NAME"
          git push origin main
