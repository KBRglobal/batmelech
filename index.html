<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>מטעמי בת מלך · ניהול הזמנות</title>
<style>
:root{
  --bg:#FBF2EE; --surface:#FFFFFF; --surface2:#FDF8F6; --ink:#41262B; --muted:#96757C;
  --accent:#B0446B; --accent-ink:#FFFFFF; --accent-soft:#F7E1E9;
  --gold:#A0761F; --gold-soft:#F7EDD8; --line:#EDD9DC;
  --ok:#3E7D4E; --ok-soft:#E2F0E5; --danger:#A63D3D; --danger-soft:#F6E2E2;
  --radius:14px; --shadow:0 1px 3px rgba(65,38,43,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#221518; --surface:#2C1D21; --surface2:#271A1E; --ink:#F2E4E1; --muted:#B99BA2;
    --accent:#E28AAC; --accent-ink:#3A1220; --accent-soft:#43242E;
    --gold:#D9A94E; --gold-soft:#3D2F17; --line:#463138;
    --ok:#7FC08D; --ok-soft:#23372A; --danger:#E09090; --danger-soft:#442525;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#221518; --surface:#2C1D21; --surface2:#271A1E; --ink:#F2E4E1; --muted:#B99BA2;
  --accent:#E28AAC; --accent-ink:#3A1220; --accent-soft:#43242E;
  --gold:#D9A94E; --gold-soft:#3D2F17; --line:#463138;
  --ok:#7FC08D; --ok-soft:#23372A; --danger:#E09090; --danger-soft:#442525;
  --shadow:0 1px 3px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#FBF2EE; --surface:#FFFFFF; --surface2:#FDF8F6; --ink:#41262B; --muted:#96757C;
  --accent:#B0446B; --accent-ink:#FFFFFF; --accent-soft:#F7E1E9;
  --gold:#A0761F; --gold-soft:#F7EDD8; --line:#EDD9DC;
  --ok:#3E7D4E; --ok-soft:#E2F0E5; --danger:#A63D3D; --danger-soft:#F6E2E2;
  --shadow:0 1px 3px rgba(65,38,43,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI","Noto Sans Hebrew","Arial Hebrew",Tahoma,Arial,sans-serif;
  font-size:16px; line-height:1.55;
}
#app{direction:rtl}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 110px}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
::placeholder{color:var(--muted);opacity:.8}

/* header */
.top{position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line);height:58px;display:flex;align-items:center}
.top-in{width:100%;padding:0 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.brand .sub{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.brand .sub{display:none}}

/* navigation — sidebar on desktop, top tabs on mobile */
.bn-item{
  display:flex;align-items:center;gap:9px;border:none;background:none;
  color:var(--muted);font-weight:700;white-space:nowrap;
}
.bn-item .ic{font-size:1.05rem;line-height:1}
@media(min-width:900px){
  #tabs{
    position:fixed;top:58px;bottom:0;right:0;width:216px;z-index:20;
    background:var(--surface);border-inline-end:1px solid var(--line);
    display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto;
  }
  .bn-item{width:100%;padding:10px 12px;border-radius:10px;font-size:.95rem;text-align:right}
  .bn-item:hover{background:var(--surface2);color:var(--ink)}
  .bn-item.active{background:var(--accent-soft);color:var(--accent)}
  .bn-item.sep{margin-top:auto}
  .wrap{margin-right:216px;max-width:1080px;padding:0 28px 90px}
  .top{padding-right:0}
}
@media(max-width:899px){
  #tabs{
    position:sticky;top:58px;z-index:20;background:var(--surface);
    border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 8px;
  }
  .bn-item{padding:10px 12px;font-size:.85rem;border-bottom:3px solid transparent}
  .bn-item.active{color:var(--accent);border-bottom-color:var(--accent)}
}

/* form quick-jump */
.jump{display:flex;gap:6px;overflow-x:auto;position:sticky;z-index:15;background:var(--bg);padding:8px 0;margin:0}
@media(min-width:900px){.jump{top:58px}}
@media(max-width:899px){.jump{top:104px}}
.jump .btn.sm{white-space:nowrap;flex-shrink:0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.02rem;margin:0 0 10px}
.sec-h .badge{font-weight:600}
.hint{color:var(--muted);font-size:.85rem}
.warn{color:var(--danger);font-size:.85rem;font-weight:600}

.field{margin:10px 0}
.field>label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* steppers + item rows */
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px}
.st-btn{width:34px;height:34px;border:none;background:none;border-radius:999px;font-size:1.15rem;line-height:1;color:var(--muted);font-weight:700}
.st-btn:hover{background:var(--accent-soft);color:var(--accent)}
.st-qty{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.st-qty.has{color:var(--accent)}
.stepper.gold .st-btn:hover{background:var(--gold-soft);color:var(--gold)}
.stepper.gold .st-qty.has{color:var(--gold)}

.item-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.item-row:last-child{border-bottom:none}
.item-name{flex:1 1 180px;min-width:150px}
.item-price{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.col-labels{display:flex;justify-content:flex-end;gap:26px;color:var(--muted);font-size:.78rem;font-weight:700;padding:0 12px 4px}
.pair{display:flex;gap:8px;align-items:center}
.note-in{margin:4px 0 2px;font-size:.9rem}
.note-in.hidden{display:none}

/* chips + badges */
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.pill.mid{background:var(--gold-soft);color:var(--gold)}
.pill.mut{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:700}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:.85rem;border-radius:8px}
.savebar{
  position:fixed;bottom:0;right:0;left:0;z-index:45;background:var(--surface);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:10px;justify-content:center;
}
.savebar .btn{min-width:130px}

/* orders list */
.date-h{display:flex;align-items:center;gap:10px;margin:20px 0 6px;flex-wrap:wrap}
.date-h .d{font-weight:800;font-size:1.05rem}
.order-card{padding:13px 16px}
.order-card.cancelled{opacity:.55}
.order-card .oc-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip-t{border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface);font-size:.82rem;margin:2px 0}
.chip-t.on{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);text-decoration:line-through}
.oos-mark{font-size:.7rem;padding:1px 7px}
.oc-name{font-weight:800;font-size:1.05rem}
.oc-total{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.oc-meta{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.oc-lines{font-size:.9rem;margin:0 0 8px;color:var(--ink)}
.oc-actions{display:flex;gap:6px;flex-wrap:wrap}
.order-text{
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:12px;white-space:pre-wrap;font-size:.92rem;margin:8px 0 0;
}
details.past{margin-top:26px}
details.past>summary{cursor:pointer;font-weight:700;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.empty .big{font-size:2rem}

/* summary */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 16px;box-shadow:var(--shadow)}
.stat .n{font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat .l{color:var(--muted);font-size:.8rem;font-weight:600}
table.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sum th{font-size:.78rem;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
table.sum td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:top}
table.sum tr:last-child td{border-bottom:none}
table.sum .num{text-align:center;width:64px;font-weight:700}
table.sum .num.gold{color:var(--gold)}
.tbl-wrap{overflow-x:auto}

.storage-warn{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:.9rem}

.badge.red{background:var(--danger-soft);color:var(--danger)}
tr.prep-row{cursor:pointer}
tr.prep-row:hover td{background:var(--surface2)}
tr.prep-row.done td{opacity:.5;text-decoration:line-through}
.chk{margin-inline-end:4px}
.cap-bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:4px}
.cap-fill{height:100%;background:var(--accent);border-radius:999px}
.cap-fill.full{background:var(--danger)}

/* bon (kitchen/customer ticket) */
#printArea{display:none;direction:rtl}
body.printing #app{display:none!important}
body.printing #printArea{display:block}
.bon{
  max-width:420px;margin:0 auto 16px;background:#fff;color:#222;
  border:1.5px solid #b09a8e;border-radius:8px;padding:20px 22px;font-size:.95rem;
}
.bon-bsd{font-size:.7rem;color:#777;margin-bottom:2px}
.bon-brand{font-size:1.5rem;font-weight:800;text-align:center;margin:0;color:#4a2c2a}
.bon-sub{text-align:center;color:#8a6b5f;font-size:.8rem;border-bottom:1px dashed #cbb5a8;padding-bottom:10px;margin-bottom:12px}
.bon-body{white-space:pre-wrap;line-height:1.65}
.bon-total{border-top:1px dashed #cbb5a8;margin-top:12px;padding-top:10px;font-weight:800;font-size:1.15rem;text-align:center;font-variant-numeric:tabular-nums}
.bon-foot{text-align:center;font-size:.8rem;color:#8a6b5f;margin-top:10px}

/* bag labels */
.labels-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:14px 0}
@media(max-width:420px){.labels-grid{grid-template-columns:1fr}}
.label{
  border:2px dashed var(--accent);border-radius:14px;padding:18px 12px;
  text-align:center;background:var(--surface);break-inside:avoid;
}
.label .lb-brand{font-weight:800;color:var(--accent);font-size:.9rem;letter-spacing:.04em}
.label .lb-kosher{font-size:.72rem;color:var(--muted)}
.label .lb-name{font-size:1.4rem;font-weight:800;margin:8px 0 3px;text-wrap:balance}
.label .lb-meta{font-size:.86rem;color:var(--muted)}

@media print{
  .top,.savebar,.no-print{display:none!important}
  body{background:#fff;color:#000}
  .card,.stat{box-shadow:none;border-color:#bbb;break-inside:avoid}
  .wrap{max-width:none;padding:0}
  .order-text{border-color:#bbb}
  .bon{border-color:#000;page-break-inside:avoid}
  .bon+.bon{page-break-before:always}
  .labels-grid{grid-template-columns:repeat(2,1fr)}
  .label{border-color:#333;background:#fff;color:#000}
  .label .lb-brand{color:#000}
  .label .lb-meta,.label .lb-kosher{color:#333}
}
</style>

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <h1>✿ מטעמי בת מלך</h1>
        <span class="sub">מערכת ניהול הזמנות · מטבח ביתי אותנטי כשר</span>
      </div>
    </div>
  </header>
  <nav class="no-print" id="tabs" aria-label="ניווט ראשי"></nav>
  <main class="wrap" id="view"></main>
</div>
<div id="printArea" dir="rtl" lang="he"></div>

<script>
'use strict';
/* ================= menu data ================= */
const MENU = {
  salads: [
    'כרוב לבן קלאסי','כרוב סגול במיונז','קולסלאו','מטבוחה פיקנטית',
    "צ'ירשי טריפוליטאי",'משוויה מרוקאית','מסייר (חמוצים)','טחינה',
    'סלק מבושל','גזר מרוקאי מבושל','חציל במיונז','חציל מטוגן',
    'פלפלים קלויים','עגבניות שרי חריפות','פלפל חריף צלוי','סלט ביצים','סלט תפו"א'
  ],
  firsts: ['פילה דג ברוטב מרוקאי','פילה דג ברוטב חריימה','קציצות דגים ברוטב מרוקאי'],
  mains: [
    'קציצות בשר ברוטב אדום עשיר','קציצות בשר עם אפונה וארטישוק','קציצות בשר בריבת בצל וערמונים',
    'טבחה עוף אדומה עם שעועית','תבשיל עוף מרוקאי עם חומוסים','טבחה עוף צהובה עם תפו"א',
    'מגש שניצלים — במקום עיקרית','רולדת בשר — במקום עיקרית'
  ],
  sides: ['אורז לבן','אורז מתובל / פרסי עם עשבי תיבול','קוסקוס עננים','פסטה נקיה','פסטה אדומה','מגש תפו"א'],
  desserts: ['סופלה שוקולד','סוכריות בקלוואה'],
  extras: [
    {name:'תוספת 4 סלטים לבחירה', price:25},
    {name:'תוספת חלה', price:10},
    {name:'צלי בקר פרוס ברוטב פטריות וערמונים (ל־4 אנשים)', price:150},
    {name:'מפרום ביתי של אמא (זוגי)', price:40},
    {name:'טבחה בשר אדומה עם אפונה ותפו"א (ל־2־3 אנשים)', price:100},
    {name:'רולדת בשר פריך ברוטב פטריות עשיר', price:100},
    {name:'מגש שניצלים (זוגי, כ־13–15 יח\')', price:100},
    {name:'מגש תפו"א קריספיים', price:30},
    {name:'מגש אורז / קוסקוס / פסטה אדומה', price:25},
    {name:'צלחת פתיחה (זיתים וחמוצים)', price:15},
    {name:'צלחת חריפים', price:15},
    {name:'תוספת חומוס ישראלי לניגוב', price:15},
    {name:'מארז הבדלה', price:20},
    {name:'סיר קובה סלק בתוספת אורז (ל־4 אנשים)', price:125},
    {name:'מנת ילדים — פסטה אדומה ושניצלונים', price:35},
    {name:'חלת שניצל (ספיישל סופ"ש)', price:28},
    {name:'מנת מפרום ביתי (תוספת)', price:20},
    {name:'משלוח', price:15}
  ],
  couplePrice:230, challahPrice:10, includedChallot:2, includedSalads:4, includedFish:2
};
const HEAT_OPTIONS = ['','לא חריף','חריף','מעורב — חלק חריף וחלק לא'];
const STATUS_OPTIONS = ['חדשה','אושרה','מוכנה','במשלוח','נמסרה','בוטלה'];
const isCancelled=o=>o.status==='בוטלה';
const OUT_POOL=[...MENU.salads,...MENU.firsts,...MENU.mains,...MENU.sides,...MENU.desserts];
const PAY_METHODS = ['','מזומן','ביט','פייבוקס','לינק','העברה'];
const PAID_OPTIONS = ['לא','מקדמה','כן','שת"פ'];

/* ================= state ================= */
const LS_KEY='batmelech-orders-v1';
let store={orders:[],settings:{maxMeals:0}};
let storageOK=true;
let view={tab:'today', summaryDate:null, search:'', custSearch:'', labelCopies:{}};
let draft=null;

function loadStore(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const d=JSON.parse(raw); if(d && Array.isArray(d.orders)) store=d; }
  }catch(e){ storageOK=false; }
  store.settings=Object.assign({maxMeals:0},store.settings||{});
  store.settings.out=Array.isArray(store.settings.out)?store.settings.out:[];
  store.customerMeta=store.customerMeta||{};
  store.prepDone=store.prepDone||{};
  const cutoff=addDays(todayStr(),-35);
  for(const k of Object.keys(store.prepDone)) if(k<cutoff) delete store.prepDone[k];
}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch(e){ storageOK=false; renderTabs(); }
}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Math.round(n*100)/100).toLocaleString('en-US')+'$';
const parseMoney=s=>{const n=parseFloat(String(s??'').replace(/[^\d.]/g,''));return isNaN(n)?0:n;};
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(ds){
  if(!ds) return 'ללא תאריך';
  const d=new Date(ds+'T00:00:00');
  if(isNaN(d)) return ds;
  const wd=new Intl.DateTimeFormat('he-IL',{weekday:'long'}).format(d);
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0');
  const yr=(d.getFullYear()!==new Date().getFullYear())?'.'+d.getFullYear():'';
  return `${wd} · ${dd}.${mm}${yr}`;
}
function fmtShort(ds){
  const d=new Date(ds+'T00:00:00');
  if(isNaN(d)) return ds;
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
}
function addDays(ds,n){
  const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function copyText(t){
  const done=()=>toast('הועתק ✓');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t)&&done());
  } else { if(fallbackCopy(t)) done(); }
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}

/* ================= price ================= */
function computeSuggested(d){
  const lines=[];
  if(d.meals>0) lines.push({l:`ארוחה זוגית ×${d.meals}`, a:MENU.couplePrice*d.meals});
  for(const ex of MENU.extras){
    const e=d.extras[ex.name];
    if(e && e.q>0) lines.push({l:`${ex.name} ×${e.q}`, a:ex.price*e.q});
  }
  for(const c of d.custom){
    const q=Number(c.qty)||0, p=parseMoney(c.price);
    if(c.name && q>0) lines.push({l:`${c.name} ×${q}`, a:p*q});
  }
  const included=MENU.includedChallot*(d.meals||0);
  const extraCh=Math.max(0,(d.challot||0)-included);
  if(extraCh>0 && d.meals>0) lines.push({l:`חלות נוספות ×${extraCh}`, a:MENU.challahPrice*extraCh});
  const total=lines.reduce((s,x)=>s+x.a,0);
  return {lines,total};
}
function countSaladsOrdered(d){ return Object.values(d.salads).reduce((s,x)=>s+(x.o||0),0); }
function countSaladsPinuk(d){ return Object.values(d.salads).reduce((s,x)=>s+(x.p||0),0); }
function countFish(d){ return Object.values(d.firsts).reduce((s,x)=>s+(x||0),0); }

/* ================= order text (like the Word card) ================= */
function waLink(phone){
  let p=String(phone||'').replace(/\D/g,'');
  if(!p) return '';
  if(p.startsWith('00')) p=p.slice(2);
  if(p.startsWith('0')) p='972'+p.slice(1);
  return 'https://wa.me/'+p;
}
function orderShortDest(o){
  if(o.pickup) return 'איסוף עצמי';
  return (o.place||'—') + (o.time?` · ${o.time}`:'');
}
function buildOrderText(o){
  const L=[];
  L.push(`ההזמנה לתאריך: ${fmtDate(o.date)}`);
  L.push(`שם מלא: ${o.name||'—'}`);
  if(o.phone) L.push(`מס' טלפון: ${o.phone}`);
  L.push(`לאן המשלוח? ${o.pickup?'איסוף עצמי':(o.place||'—')}${(!o.pickup&&o.time)?` (הגעה: ${o.time})`:''}`);
  if(!o.pickup&&o.address) L.push(`כתובת: ${o.address}`);
  if(o.meals>0) L.push(`ארוחה זוגית ×${o.meals}`);
  const saladLines=[];
  for(const name of Object.keys(o.salads)){
    const s=o.salads[name];
    if(s.o>0) saladLines.push(`${name}${s.o>1?` ×${s.o}`:''}`);
  }
  for(const name of Object.keys(o.salads)){
    const s=o.salads[name];
    if(s.p>0) saladLines.push(`${name}${s.p>1?` ×${s.p}`:''} — פינוק 🎁`);
  }
  if(saladLines.length){
    L.push('סלטים:');
    saladLines.forEach((s,i)=>L.push(`  ${i+1}. ${s}`));
  }
  const firstParts=Object.keys(o.firsts).filter(k=>o.firsts[k]>0).map(k=>`${k} ×${o.firsts[k]}`);
  if(firstParts.length){
    let line=`ראשונה: ${firstParts.join(', ')}`;
    if(o.heat) line+=` (${o.heat})`;
    L.push(line);
    if(o.firstsNote) L.push(`  הערה: ${o.firstsNote}`);
  }
  const mainParts=Object.keys(o.mains).filter(k=>o.mains[k]>0).map(k=>`${k}${o.mains[k]>1?` ×${o.mains[k]}`:''}`);
  if(mainParts.length){
    L.push(`עיקרית: ${mainParts.join(', ')}`);
    if(o.mainsNote) L.push(`  הערה: ${o.mainsNote}`);
  }
  const sideParts=Object.keys(o.sides).filter(k=>o.sides[k]>0).map(k=>`${k}${o.sides[k]>1?` ×${o.sides[k]}`:''}`);
  if(sideParts.length) L.push(`תוספת: ${sideParts.join(', ')}`);
  const desParts=Object.keys(o.desserts).filter(k=>o.desserts[k]>0).map(k=>`${k}${o.desserts[k]>1?` ×${o.desserts[k]}`:''}`);
  if(desParts.length) L.push(`קינוח: ${desParts.join(', ')}`);
  const exLines=[];
  for(const name of Object.keys(o.extras)){
    const e=o.extras[name];
    if(e.q>0) exLines.push(`${name} ×${e.q}${e.note?` (${e.note})`:''}`);
  }
  for(const c of o.custom){ if(c.name && (Number(c.qty)||0)>0) exLines.push(`${c.name} ×${c.qty}${c.price?` (${parseMoney(c.price)}$)`:''}`); }
  if(exLines.length){ L.push('אקסטרה:'); exLines.forEach(x=>L.push(`  • ${x}`)); }
  if(o.aricha>0) L.push(`עריכה: ${o.aricha} איש`);
  if(o.challot>0) L.push(`חלות: ${o.challot} יח'`);
  if(o.total) L.push(`סך לתשלום: ${parseMoney(o.total)}$`);
  if(o.deposit) L.push(`מקדמה: ${parseMoney(o.deposit)}$`);
  if(o.payMethod) L.push(`דרך תשלום: ${o.payMethod}`);
  L.push(`שולם: ${o.paid||'לא'}`);
  if(o.notes) L.push(`הערות: ${o.notes}`);
  return L.join('\n');
}

function applyImported(p){
  const d=newDraft();
  for(const k of ['date','name','phone','place','address','time','heat','firstsNote','mainsNote','notes']){
    if(typeof p[k]==='string') d[k]=p[k];
  }
  if(typeof p.pickup==='boolean') d.pickup=p.pickup;
  for(const k of ['meals','aricha','challot']){
    if(typeof p[k]==='number'&&p[k]>=0) d[k]=Math.floor(p[k]);
  }
  const qtyMap=(src,allowed)=>{
    const out={};
    if(src&&typeof src==='object') for(const [n,q] of Object.entries(src)){
      if(allowed.includes(n)&&typeof q==='number'&&q>0) out[n]=Math.floor(q);
    }
    return out;
  };
  if(p.salads&&typeof p.salads==='object'){
    for(const [n,q] of Object.entries(p.salads)){
      if(MENU.salads.includes(n)&&typeof q==='number'&&q>0) d.salads[n]={o:Math.floor(q),p:0};
    }
  }
  d.firsts=qtyMap(p.firsts,MENU.firsts);
  d.mains=qtyMap(p.mains,MENU.mains);
  d.sides=qtyMap(p.sides,MENU.sides);
  d.desserts=qtyMap(p.desserts,MENU.desserts);
  if(p.extras&&typeof p.extras==='object'){
    const names=MENU.extras.map(x=>x.name);
    for(const [n,e] of Object.entries(p.extras)){

function updatePriceHint(){
  const el=$('#priceHint'); if(!el||!draft) return;
  const sug=computeSuggested(draft);
  const warns=[];
  const inclS=MENU.includedSalads*(draft.meals||0);
  const nO=countSaladsOrdered(draft);
  if(draft.meals>0 && nO>inclS) warns.push(`הוזמנו ${nO-inclS} סלטים מעבר לכלול — לא לשכוח לחייב (תוספת 4 סלטים = 25$).`);
  const inclF=MENU.includedFish*(draft.meals||0);
  const nF=countFish(draft);
  if(draft.meals>0 && nF>inclF) warns.push(`הוזמנו ${nF-inclF} דגים מעבר לכלול.`);
  const max=store.settings.maxMeals||0;
  if(max>0&&draft.date&&draft.meals>0&&draft.status!=='בוטלה'){
    const others=store.orders.filter(o=>o.date===draft.date&&o.id!==draft.id&&!isCancelled(o)).reduce((s,o)=>s+(o.meals||0),0);
    const tot=others+draft.meals;
    if(tot>max) warns.push(`עומס! עם ההזמנה הזאת יהיו ${tot} זוגיות ב־${fmtShort(draft.date)} — מעבר לתקרה שקבעת (${max}).`);
    else if(tot===max) warns.push(`התאריך ${fmtShort(draft.date)} מתמלא: ${tot}/${max} זוגיות.`);
  }
  let html='';
  if(sug.lines.length){
    html+=`<div class="hint" style="margin-bottom:8px">מחיר מוצע לפי המחירון: `+
      sug.lines.map(l=>`${esc(l.l)} = ${l.a}$`).join(' · ')+
      ` · <b>סה"כ ${sug.total}$</b> <button type="button" class="btn sm" data-act="useSuggested" data-total="${sug.total}">להשתמש במחיר הזה</button></div>`;
  }
  html+=warns.map(w=>`<div class="warn">⚠️ ${esc(w)}</div>`).join('');
  el.innerHTML=html;
}

/* ================= bump ================= */
function bump(g,i,k,delta){
  const d=draft; if(!d) return 0;
  let nv=0;
  if(g==='meals'||g==='challot'||g==='aricha'){
    nv=Math.max(0,(d[g]||0)+delta); d[g]=nv;
  } else if(g==='salads'){
    const name=MENU.salads[i];
    const s=d.salads[name]||(d.salads[name]={o:0,p:0});
    s[k]=Math.max(0,(s[k]||0)+delta); nv=s[k];
    if(!s.o&&!s.p) delete d.salads[name];
  } else if(g==='firsts'||g==='mains'||g==='sides'||g==='desserts'){
    const name=MENU[g][i];
    nv=Math.max(0,(d[g][name]||0)+delta);
    if(nv===0) delete d[g][name]; else d[g][name]=nv;
  } else if(g==='extras'){
    const name=MENU.extras[i].name;
    const e=d.extras[name]||(d.extras[name]={q:0,note:''});
    e.q=Math.max(0,e.q+delta); nv=e.q;
    if(e.q===0&&!e.note) delete d.extras[name];
  }
  return nv;
}

/* ================= render: summary ================= */
function aggregate(list){
  const agg={
    orders:list.length, meals:0, aricha:0, challot:0,
    salads:{}, firsts:{}, mains:{}, sides:{}, desserts:{}, extras:[],
    heatNotes:[], generalNotes:[],
    revenue:0, deposits:0, owed:0
  };
  for(const o of list){
    agg.meals+=o.meals||0; agg.aricha+=o.aricha||0; agg.challot+=o.challot||0;
    for(const [n,s] of Object.entries(o.salads)){
      const a=agg.salads[n]||(agg.salads[n]={o:0,p:0});
      a.o+=s.o||0; a.p+=s.p||0;
    }
    for(const [n,q] of Object.entries(o.firsts)) agg.firsts[n]=(agg.firsts[n]||0)+q;
    for(const [n,q] of Object.entries(o.mains)) agg.mains[n]=(agg.mains[n]||0)+q;
    for(const [n,q] of Object.entries(o.sides)) agg.sides[n]=(agg.sides[n]||0)+q;
    for(const [n,q] of Object.entries(o.desserts)) agg.desserts[n]=(agg.desserts[n]||0)+q;
    for(const [n,e] of Object.entries(o.extras)){
      if(e.q>0) agg.extras.push({who:o.name, what:n, q:e.q, note:e.note, date:o.date});
    }
    for(const c of o.custom){ if(c.name&&(Number(c.qty)||0)>0) agg.extras.push({who:o.name, what:c.name, q:Number(c.qty)||0, note:c.price?`${parseMoney(c.price)}$`:'', date:o.date}); }
    if(o.heat||o.firstsNote) agg.heatNotes.push({who:o.name, txt:[o.heat,o.firstsNote].filter(Boolean).join(' · '), date:o.date});
    if(o.mainsNote) agg.generalNotes.push({who:o.name, txt:'עיקרית: '+o.mainsNote, date:o.date});
    if(o.notes) agg.generalNotes.push({who:o.name, txt:o.notes, date:o.date});
    const tot=parseMoney(o.total), dep=parseMoney(o.deposit);
    agg.revenue+=tot; agg.deposits+=dep;
    if(o.paid!=='כן'&&o.paid!=='שת"פ') agg.owed+=Math.max(0,tot-dep);
  }
  return agg;
}
function breakdowns(list){
  const bd={salads:{},firsts:{},mains:{},sides:{},desserts:{},challot:{}};
  const add=(cat,n,dt,q)=>{ const m=bd[cat][n]=bd[cat][n]||{}; m[dt]=(m[dt]||0)+q; };
  for(const o of list){
    const dt=o.date;
    for(const [n,s] of Object.entries(o.salads)) add('salads',n,dt,(s.o||0)+(s.p||0));
    for(const [n,q] of Object.entries(o.firsts)) add('firsts',n,dt,q);
    for(const [n,q] of Object.entries(o.mains)) add('mains',n,dt,q);
    for(const [n,q] of Object.entries(o.sides)) add('sides',n,dt,q);
    for(const [n,q] of Object.entries(o.desserts)) add('desserts',n,dt,q);
    if(o.challot>0) bd.challot[dt]=(bd.challot[dt]||0)+o.challot;
  }
  return bd;
}
function bdLine(bdMap,n){
  if(!bdMap||!bdMap[n]) return '';
  const parts=Object.entries(bdMap[n]).sort().map(([dt,q])=>`${fmtShort(dt)}: ${q}`);
  return `<div class="hint">${esc(parts.join(' · '))}</div>`;
}
function prepMap(dateKey){ return store.prepDone[dateKey]||(store.prepDone[dateKey]={}); }
function sumTable(title, obj, opts){

    if(!chk) return '<tr>';

    return `<tr class="prep-row${done[key]?' done':''}" data-check="${esc(key)}">`;
  };
  const mark=n=>chk?`<span class="chk">${done[chk.cat+'|'+n]?'✅':'⬜'}</span>`:'';
  const doneCount=chk?rows.filter(([n])=>done[chk.cat+'|'+n]).length:0;
  const prog=chk?` <span class="badge${doneCount===rows.length?' gold':''}">${doneCount}/${rows.length} ✓</span>`:'';
  if(opts.pinukCols){
    return `<div class="card"><div class="sec-h">${title}${prog}</div><div class="tbl-wrap"><table class="sum">
      <tr><th>סלט</th><th class="num">הוזמן</th><th class="num">🎁 פינוק</th><th class="num">סה"כ</th></tr>
      ${rows.map(([n,v])=>`${rowOpen(n)}<td>${mark(n)}${esc(n)}${bdLine(bd,n)}</td><td class="num">${v.o||''}</td><td class="num gold">${v.p||''}</td><td class="num">${(v.o||0)+(v.p||0)}</td></tr>`).join('')}
      <tr><td><b>סה"כ סלטים</b></td><td class="num"><b>${rows.reduce((s,[,v])=>s+(v.o||0),0)}</b></td><td class="num gold"><b>${rows.reduce((s,[,v])=>s+(v.p||0),0)}</b></td><td class="num"><b>${rows.reduce((s,[,v])=>s+(v.o||0)+(v.p||0),0)}</b></td></tr>
    </table></div></div>`;
  }
  return `<div class="card"><div class="sec-h">${title}${prog}</div><div class="tbl-wrap"><table class="sum">
    <tr><th>מנה</th><th class="num">כמות</th></tr>
    ${rows.map(([n,v])=>`${rowOpen(n)}<td>${mark(n)}${esc(n)}${bdLine(bd,n)}</td><td class="num">${v}</td></tr>`).join('')}
  </table></div></div>`;
}

  const scopeDates=[...new Set(list.map(o=>o.date))].sort();

}

function buildDayText(){
  const sc=summaryScope();
  const {list,title,multi}=sc;
  const agg=aggregate(list);
  const bd=multi?breakdowns(list):null;
  const bdTxt=(cat,n)=>{
    if(!bd||!bd[cat][n]) return '';
    return ' ('+Object.entries(bd[cat][n]).sort().map(([d,q])=>`${fmtShort(d)}: ${q}`).join(', ')+')';
  };
  const L=[`🍲 סיכום הכנות — ${title}`,
    `${agg.orders} הזמנות · ${agg.meals} ארוחות זוגיות · ${agg.challot} חלות${agg.aricha?` · עריכה ל־${agg.aricha} איש`:''}`,''];
  const sal=Object.entries(agg.salads).filter(([,v])=>v.o+v.p>0);
  if(sal.length){
    L.push('🥗 סלטים:');
    for(const [n,v] of sal) L.push(`  • ${n}: ${(v.o||0)+(v.p||0)}${v.p?` (מתוכם ${v.p} פינוק 🎁)`:''}${bdTxt('salads',n)}`);
    L.push('');
  }
  const block=(bTitle,obj,cat)=>{
    const rows=Object.entries(obj).filter(([,v])=>v>0);
    if(!rows.length) return;
    L.push(bTitle);
    for(const [n,q] of rows) L.push(`  • ${n}: ${q}${bdTxt(cat,n)}`);
    L.push('');
  };
  block('🐟 ראשונות:',agg.firsts,'firsts');
  block('🍖 עיקריות:',agg.mains,'mains');
  block('🍚 תוספות:',agg.sides,'sides');
  block('🍫 קינוחים:',agg.desserts,'desserts');
  if(agg.extras.length){
    L.push('✨ אקסטרות:');
    for(const e of agg.extras) L.push(`  • ${e.what} ×${e.q} (${e.who})${e.note?` — ${e.note}`:''}`);
    L.push('');
  }
  if(agg.heatNotes.length||agg.generalNotes.length){
    L.push('📌 הערות:');
    for(const n of agg.heatNotes) L.push(`  • ${n.who} — חריפות: ${n.txt}`);
    for(const n of agg.generalNotes) L.push(`  • ${n.who} — ${n.txt}`);
    L.push('');
  }
  L.push('🚚 משלוחים:');
  for(const o of list) L.push(`  • ${multi?fmtShort(o.date)+' — ':''}${o.time&&!o.pickup?o.time+' — ':''}${o.name} — ${o.pickup?'איסוף עצמי':(o.place||'—')}${o.phone?' — '+o.phone:''}`);
  L.push('');
  L.push(`💰 סה"כ: ${money(agg.revenue)} · נשאר לגבות: ${money(agg.owed)}`);
  return L.join('\n');
}

  const max=store.settings.maxMeals||0;

  let html=`<h2 style="margin:18px 0 2px;font-size:1.3rem">${greet} 🌸</h2>

    $('#view').innerHTML=html; return;

      todayList.map(o=>`<div class="item-row">

        <button type="button" class="btn sm" data-act="edit" data-id="${o.id}">פתיחה</button>
      </div>`).join('')+

  }
  const upDates=[...new Set(up.map(o=>o.date))].sort().slice(0,4);
  if(upDates.length){
    html+=`<div class="card"><div class="sec-h">📅 העומס הקרוב</div>`+
      upDates.map(dk=>{
        const list=up.filter(o=>o.date===dk);
        const meals=list.reduce((s,o)=>s+(o.meals||0),0);

        </div>`;
      }).join('')+
      (max>0?'':`<p class="hint">טיפ: בלשונית «גיבוי» אפשר להגדיר תקרת זוגיות לשישי — ואז תראי כאן בדיוק כמה מקום נשאר.</p>`)+

    html+=`<div class="card"><p class="hint">אין הזמנות קרובות כרגע.</p></div>`;

  const owed=up.reduce((s,o)=>(o.paid!=='כן'&&o.paid!=='שת"פ')?s+Math.max(0,parseMoney(o.total)-parseMoney(o.deposit)):s,0);

  $('#view').innerHTML=html;

function buildRouteText(){
  const sc=summaryScope();
  const dl=sc.list.filter(o=>!o.pickup), pk=sc.list.filter(o=>o.pickup);
  const L=[`🚚 מסלול משלוחים — ${sc.title}`,''];
  dl.forEach((o,i)=>{
    L.push(`${i+1}. ${sc.multi?fmtShort(o.date)+' · ':''}${o.time?o.time+' — ':''}${o.name} — ${o.place||'—'}${o.address?` (${o.address})`:''}`);
    if(o.phone) L.push(`   📞 ${o.phone}`);
    const owe=(o.paid!=='כן'&&o.paid!=='שת"פ')?Math.max(0,parseMoney(o.total)-parseMoney(o.deposit)):0;
    if(owe>0) L.push(`   💰 לגבות: ${owe}$`);
    if(o.place) L.push(`   🗺️ https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((o.place+' '+(o.address||'')+' Dubai').trim())}`);
    L.push('');
  });
  if(pk.length){
    L.push('🏠 איסוף עצמי:');
    for(const o of pk) L.push(`  • ${o.name}${o.phone?' — '+o.phone:''}`);
  }
  return L.join('\n');
}

function markBackedUp(){
  store.lastBackup=Date.now(); saveStore();
  if(view.tab==='today') renderToday();
  else if(view.tab==='backup') renderBackup();
}
function exportData(asFile){
  const json=JSON.stringify(store,null,1);
  const fname='batmelech-orders-'+todayStr()+'.json';
  if(!asFile){ copyText(json); markBackedUp(); return; }
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({filename:fname, data:json})
      .then(()=>{ toast('הגיבוי נשמר ✓'); markBackedUp(); })
      .catch(err=>{ if(err&&err.code==='declined') return; toast('השמירה לא הצליחה — אפשר להעתיק כטקסט'); });
    return;
  }
  try{
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},500);
    toast('הגיבוי ירד ✓');
    markBackedUp();
  }catch(e){ toast('השמירה לא הצליחה — אפשר להעתיק כטקסט'); }
}
function importApply(){
  const txt=($('#importText')||{}).value||'';
  if(!txt.trim()){ toast('אין מה לשחזר — קודם לבחור קובץ או להדביק טקסט'); return; }
  let d;
  try{ d=JSON.parse(txt); }catch(e){ toast('הטקסט לא תקין — זה לא קובץ גיבוי'); return; }
  if(!d||!Array.isArray(d.orders)){ toast('הקובץ לא נראה כמו גיבוי של המערכת'); return; }
  if(!confirm(`לשחזר ${d.orders.length} הזמנות? זה יחליף את ${store.orders.length} ההזמנות הנוכחיות.`)) return;
  store=d; store.settings=Object.assign({maxMeals:0},d.settings||{});
  saveStore(); view.tab='orders'; render(); toast('שוחזר ✓');
}

function saveDraft(){
  if(!draft.date){ toast('חסר תאריך להזמנה 🗓️'); const el=document.querySelector('[data-bind="date"]'); if(el) el.focus(); return; }
  if(!draft.name.trim()){ toast('חסר שם לקוח 👤'); const el=document.querySelector('[data-bind="name"]'); if(el) el.focus(); return; }
  if(!draft.id){ draft.id=uid(); store.orders.push(draft); }
  else {
    const i=store.orders.findIndex(o=>o.id===draft.id);
    if(i>=0) store.orders[i]=draft; else store.orders.push(draft);
  }
  saveStore();
  draft=null; view.tab='orders'; render(); toast('ההזמנה נשמרה ✓');
}

document.addEventListener('click', e=>{
  const chkRow=e.target.closest('tr[data-check]');
  if(chkRow&&view.tab==='summary'){
    const sc=summaryScope();
    if(sc.scopeDates.length===1){
      const key=chkRow.dataset.check;
      const dm=prepMap(sc.scopeDates[0]);
      if(dm[key]) delete dm[key]; else dm[key]=true;
      saveStore(); renderSummary();
    }
    return;
  }
  const btn=e.target.closest('[data-act]');
  if(!btn) return;
  const act=btn.dataset.act;
  if(act==='tab'){
    const t=btn.dataset.tab;
    if(t==='form'){ draft=newDraft(); }
    view.tab=t; render(); return;
  }
  if(act==='bump'){
    const g=btn.dataset.group, i=Number(btn.dataset.i), k=btn.dataset.k||null, dd=Number(btn.dataset.d);
    const nv=bump(g,i,k,dd);
    const cell=document.querySelector(`[data-cell="${g}|${i}${k?'|'+k:''}"]`);
    if(cell){ cell.textContent=nv; cell.classList.toggle('has',nv>0); }
    if(g==='extras'){
      const note=document.querySelector(`[data-note-cell="extras|${i}"]`);
      if(note) note.classList.toggle('hidden',nv===0);
    }
    if(g==='pickup') return;
    refreshFormDerived(); return;
  }
  if(act==='useSuggested'){
    draft.total=btn.dataset.total;
    const el=document.querySelector('[data-bind="total"]'); if(el) el.value=draft.total;
    toast('המחיר עודכן ✓'); return;
  }
  if(act==='importOrder'){
    const ta=$('#importOrderText');
    const p=parseOrderCode(ta?ta.value:'');
    if(!p){ toast('לא נמצא קוד הזמנה בהודעה — צריך להדביק את כל ההודעה'); return; }
    draft=applyImported(p);
    renderForm();
    toast('הטופס מולא מההזמנה של הלקוח ✓ עכשיו רק לבדוק ולשמור');
    return;
  }
  if(act==='addCustom'){ draft.custom.push({name:'',qty:1,price:''}); renderForm(); return; }
  if(act==='delCustom'){ draft.custom.splice(Number(btn.dataset.i),1); renderForm(); return; }
  if(act==='save'){ saveDraft(); return; }
  if(act==='cancel'){
    draft=null; view.tab='orders'; render(); return;
  }
  if(act==='edit'){
    const o=store.orders.find(x=>x.id===btn.dataset.id);
    if(o){ draft=draftFrom(o); view.tab='form'; render(); }
    return;
  }
  if(act==='dup'){
    const o=store.orders.find(x=>x.id===btn.dataset.id);
    if(o){ draft=draftFrom(o); draft.id=null; draft.paid='לא'; draft.deposit=''; view.tab='form'; render(); toast('הועתק — אפשר לערוך ולשמור כהזמנה חדשה'); }
    return;
  }
  if(act==='del'){
    const o=store.orders.find(x=>x.id===btn.dataset.id);
    if(o && confirm(`למחוק את ההזמנה של ${o.name||'ללא שם'}?`)){
      store.orders=store.orders.filter(x=>x.id!==o.id);
      saveStore(); render(); toast('נמחק');
    }
    return;
  }
  if(act==='toggleText'){
    const el=document.querySelector(`[data-text-for="${btn.dataset.id}"]`);
    if(el) el.hidden=!el.hidden;
    return;
  }
  if(act==='copyText'){
    const o=store.orders.find(x=>x.id===btn.dataset.id);
    if(o) copyText(buildOrderText(o));
    return;
  }
  if(act==='daySummary'){ view.tab='summary'; view.summaryDate=btn.dataset.date; render(); return; }
  if(act==='clearSearch'){
    view.search='';
    const si=$('#searchIn'); if(si){ si.value=''; si.focus(); }
    renderOrdersList(); return;
  }
  if(act==='print'){ window.print(); return; }
  if(act==='copyDay'){ copyText(buildDayText()); return; }
  if(act==='bon'){
    const o=store.orders.find(x=>x.id===btn.dataset.id);
    if(o) printHtml(bonHtml(o));
    return;
  }
  if(act==='printBons'){
    const sc=summaryScope();
    if(!sc.list.length){ toast('אין הזמנות להדפסה'); return; }
    printHtml(sc.list.map(bonHtml).join(''));
    return;
  }
  if(act==='labels'){ view.tab='labels'; render(); return; }
  if(act==='labelsBack'){ view.tab='summary'; render(); return; }
  if(act==='lbBump'){
    const id=btn.dataset.id, dd=Number(btn.dataset.d);
    const cur=view.labelCopies[id]===undefined?1:view.labelCopies[id];
    const nv=Math.max(0,cur+dd);
    view.labelCopies[id]=nv;
    const cell=document.querySelector(`[data-lb="${id}"]`);
    if(cell){ cell.textContent=nv; cell.classList.toggle('has',nv>0); }
    const pv=$('#lbPreview');
    if(pv) pv.innerHTML=labelsHtml(summaryScope().list);
    return;
  }
  if(act==='jump'){
    const el=document.getElementById(btn.dataset.target);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(act==='copyRoute'){ copyText(buildRouteText()); return; }
  if(act==='sendRoute'){
    const t=buildRouteText();
    copyText(t);
    window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
    return;
  }
  if(act==='toggleOut'){
    const name=OUT_POOL[Number(btn.dataset.i)];
    const out=store.settings.out;
    const idx=out.indexOf(name);
    if(idx>=0) out.splice(idx,1); else out.push(name);
    saveStore(); renderBackup(); return;
  }
  if(act==='custVip'){
    const key=btn.dataset.key;
    const m=store.customerMeta[key]||(store.customerMeta[key]={});
    m.vip=!m.vip;
    saveStore(); renderCustomersList(); return;
  }
  if(act==='printLabels'){
    const html=labelsHtml(summaryScope().list);
    if(html.includes('labels-grid')) printHtml(html);
    else toast('אין מדבקות להדפסה — כל הכמויות על 0');
    return;
  }
  if(act==='exportFile'){ exportData(true); return; }
  if(act==='exportCopy'){ exportData(false); return; }
  if(act==='importApply'){ importApply(); return; }
});

function handleBind(e){
  const b=e.target.dataset.bind;
  if(!b) return;
  if(b==='summaryDate'){
    view.summaryDate=e.target.value;
    if(view.tab==='delivery') renderDelivery(); else renderSummary();
    return;
  }
  if(b==='search'){ view.search=e.target.value; renderOrdersList(); return; }
  if(b==='custSearch'){ view.custSearch=e.target.value; renderCustomersList(); return; }
  if(b==='custNote'){
    const key=e.target.dataset.key;
    const m=store.customerMeta[key]||(store.customerMeta[key]={});
    m.notes=e.target.value;
    saveStore(); return;
  }
  if(b==='maxMeals'){
    store.settings.maxMeals=Math.max(0,parseInt(e.target.value,10)||0);
    saveStore(); return;
  }
  if(!draft) return;
  const v=e.target.value;
  const i=Number(e.target.dataset.i);
  switch(b){
    case 'date': draft.date=v; updatePriceHint(); break;
    case 'name': draft.name=v; break;
    case 'phone': draft.phone=v; break;
    case 'place': draft.place=v; break;
    case 'address': draft.address=v; break;
    case 'time': draft.time=v; break;
    case 'status': draft.status=v; break;
    case 'pickup': {
      draft.pickup=e.target.checked;
      const df=$('#deliveryFields'); if(df) df.hidden=draft.pickup;
      break;
    }
    case 'heat': draft.heat=v; break;
    case 'firstsNote': draft.firstsNote=v; break;
    case 'mainsNote': draft.mainsNote=v; break;
    case 'notes': draft.notes=v; break;
    case 'total': draft.total=v; break;
    case 'deposit': draft.deposit=v; break;
    case 'payMethod': draft.payMethod=v; break;
    case 'paid': draft.paid=v; break;
    case 'extra-note': {
      const name=MENU.extras[i].name;
      const ex=draft.extras[name]||(draft.extras[name]={q:0,note:''});
      ex.note=v;
      if(ex.q===0&&!ex.note) delete draft.extras[name];
      break;
    }
    case 'custom-name': if(draft.custom[i]) draft.custom[i].name=v; break;
    case 'custom-qty': if(draft.custom[i]){ draft.custom[i].qty=v; updatePriceHint(); } break;
    case 'custom-price': if(draft.custom[i]){ draft.custom[i].price=v; updatePriceHint(); } break;
  }
}
document.addEventListener('input', handleBind);
document.addEventListener('change', e=>{
  if(e.target.type==='checkbox'||e.target.tagName==='SELECT'||e.target.type==='date') handleBind(e);
});

/* ================= init ================= */
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');
loadStore();
render();
</script>

</body>
</html>
