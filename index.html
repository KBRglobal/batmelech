<!doctype html>
<html dir="rtl" lang="he"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>מטעמי בת מלך · ניהול הזמנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDEDF1; --surface:#FFFFFF; --surface2:#FDF4F7; --surface-soft:#FBE3EA; --ink:#3B151A; --muted:#8A5A66;
  --accent:#C24E76; --accent-ink:#FFFFFF; --accent-soft:#F2B8C9;
  --gold:#D98A2B; --gold-soft:#FBEFDC; --line:#E8A9BE;
  --ok:#4E8A5A; --ok-soft:#E2F0E5; --danger:#B23B3B; --danger-soft:#F8E3E3;
  --radius:18px; --shadow:0 2px 8px rgba(59,21,26,.07);
  --font-d:'Rubik','Assistant','Segoe UI',Tahoma,Arial,sans-serif;
  --flower:url("data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2040%2040'%3E%3Cg%20fill='%23F2B8C9'%20stroke='%233B151A'%20stroke-width='1.7'%3E%3Cellipse%20cx='20'%20cy='9.5'%20rx='5.2'%20ry='8'/%3E%3Cellipse%20cx='20'%20cy='9.5'%20rx='5.2'%20ry='8'%20transform='rotate(72%2020%2020)'/%3E%3Cellipse%20cx='20'%20cy='9.5'%20rx='5.2'%20ry='8'%20transform='rotate(144%2020%2020)'/%3E%3Cellipse%20cx='20'%20cy='9.5'%20rx='5.2'%20ry='8'%20transform='rotate(216%2020%2020)'/%3E%3Cellipse%20cx='20'%20cy='9.5'%20rx='5.2'%20ry='8'%20transform='rotate(288%2020%2020)'/%3E%3C/g%3E%3Ccircle%20cx='20'%20cy='20'%20r='4.6'%20fill='%23D98A2B'%20stroke='%233B151A'%20stroke-width='1.7'/%3E%3C/svg%3E") no-repeat center/contain;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#231418; --surface:#2E1B21; --surface2:#281820; --surface-soft:#3A222B; --ink:#F6E7EA; --muted:#C79AA6;
    --accent:#E58BAD; --accent-ink:#33121F; --accent-soft:#4A2531;
    --gold:#E3A94F; --gold-soft:#3E2F16; --line:#57323E;
    --ok:#86C693; --ok-soft:#22372A; --danger:#E79B9B; --danger-soft:#472628;
    --shadow:0 2px 8px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#231418; --surface:#2E1B21; --surface2:#281820; --surface-soft:#3A222B; --ink:#F6E7EA; --muted:#C79AA6;
  --accent:#E58BAD; --accent-ink:#33121F; --accent-soft:#4A2531;
  --gold:#E3A94F; --gold-soft:#3E2F16; --line:#57323E;
  --ok:#86C693; --ok-soft:#22372A; --danger:#E79B9B; --danger-soft:#472628;
  --shadow:0 2px 8px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#FDEDF1; --surface:#FFFFFF; --surface2:#FDF4F7; --surface-soft:#FBE3EA; --ink:#3B151A; --muted:#8A5A66;
  --accent:#C24E76; --accent-ink:#FFFFFF; --accent-soft:#F2B8C9;
  --gold:#D98A2B; --gold-soft:#FBEFDC; --line:#E8A9BE;
  --ok:#4E8A5A; --ok-soft:#E2F0E5; --danger:#B23B3B; --danger-soft:#F8E3E3;
  --shadow:0 2px 8px rgba(59,21,26,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Assistant','Noto Sans Hebrew','Segoe UI','Arial Hebrew',Tahoma,Arial,sans-serif;
  font-size:16px; line-height:1.55;
}
h1,.sec-h,.oc-name,.date-h .d,.stat .n,.bon-brand,.lb-name{font-family:var(--font-d)}
#app{direction:rtl}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 110px}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
::placeholder{color:var(--muted);opacity:.8}

/* header */
.top{position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line);height:58px;display:flex;align-items:center}
.top-in{width:100%;padding:0 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:.02em;white-space:nowrap;color:var(--accent)}
.brand .sub{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.brand .sub{display:none}}

/* navigation — sidebar on desktop, top tabs on mobile */
.bn-item{
  display:flex;align-items:center;gap:9px;border:none;background:none;
  color:var(--muted);font-weight:700;white-space:nowrap;
}
.bn-item .ic{font-size:1.05rem;line-height:1}
.bn-item.active::before{content:'';width:15px;height:15px;background:var(--flower);flex-shrink:0}
@media(min-width:900px){
  #tabs{
    position:fixed;top:58px;bottom:0;right:0;width:216px;z-index:20;
    background:var(--surface);border-inline-end:1px solid var(--line);
    display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto;
  }
  .bn-item{width:100%;padding:10px 12px;border-radius:10px;font-size:.95rem;text-align:right}
  .bn-item:hover{background:var(--surface2);color:var(--ink)}
  .bn-item.active{background:var(--accent-soft);color:var(--accent)}
  .bn-item.sep{margin-top:auto}
  .wrap{margin-right:216px;max-width:1080px;padding:0 28px 90px}
  .top{padding-right:0}
}
@media(max-width:899px){
  #tabs{
    position:sticky;top:58px;z-index:20;background:var(--surface);
    border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 8px;
  }
  .bn-item{padding:10px 12px;font-size:.85rem;border-bottom:3px solid transparent}
  .bn-item.active{color:var(--accent);border-bottom-color:var(--accent)}
}

/* form quick-jump */
.jump{display:flex;gap:6px;overflow-x:auto;position:sticky;z-index:15;background:var(--bg);padding:8px 0;margin:0}
@media(min-width:900px){.jump{top:58px}}
@media(max-width:899px){.jump{top:104px}}
.jump .btn.sm{white-space:nowrap;flex-shrink:0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.02rem;margin:0 0 10px;
  background:var(--surface-soft);border-radius:12px;padding:7px 12px;color:var(--accent)}
.sec-h::before{content:'';width:19px;height:19px;background:var(--flower);flex-shrink:0}
.sec-h .badge{font-weight:600}
.hint{color:var(--muted);font-size:.85rem}
.warn{color:var(--danger);font-size:.85rem;font-weight:600}

.field{margin:10px 0}
.field>label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* steppers + item rows */
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px}
.st-btn{width:34px;height:34px;border:none;background:none;border-radius:999px;font-size:1.15rem;line-height:1;color:var(--muted);font-weight:700}
.st-btn:hover{background:var(--accent-soft);color:var(--accent)}
.st-qty{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.st-qty.has{color:var(--accent)}
.stepper.gold .st-btn:hover{background:var(--gold-soft);color:var(--gold)}
.stepper.gold .st-qty.has{color:var(--gold)}

.item-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.item-row:last-child{border-bottom:none}
.item-name{flex:1 1 180px;min-width:150px}
.item-price{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.col-labels{display:flex;justify-content:flex-end;gap:26px;color:var(--muted);font-size:.78rem;font-weight:700;padding:0 12px 4px}
.pair{display:flex;gap:8px;align-items:center}
.note-in{margin:4px 0 2px;font-size:.9rem}
.note-in.hidden{display:none}

/* chips + badges */
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.pill.mid{background:var(--gold-soft);color:var(--gold)}
.pill.mut{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.btn.sm{padding:5px 12px;font-size:.85rem;border-radius:999px}
@media(max-width:899px){.btn{min-height:40px}.st-btn{width:40px;height:40px}}
.savebar{
  position:fixed;bottom:0;right:0;left:0;z-index:45;background:var(--surface);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:10px;justify-content:center;
}
.savebar .btn{min-width:130px}

/* orders list */
.date-h{display:flex;align-items:center;gap:10px;margin:20px 0 6px;flex-wrap:wrap}
.grp-block{margin:10px 0;padding:2px 10px 10px;border:1px dashed var(--gold);border-radius:var(--radius)}
.grp-block .date-h{margin-top:10px;padding:4px 8px;border-radius:10px}
.date-h .d{font-weight:800;font-size:1.05rem}
.order-card{padding:13px 16px}
.order-card.cancelled{opacity:.55}
.order-card .oc-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip-t{border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface);font-size:.82rem;margin:2px 0}
.chip-t.on{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);text-decoration:line-through}
.oos-mark{font-size:.7rem;padding:1px 7px}
.oc-name{font-weight:800;font-size:1.05rem}
.oc-total{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.oc-meta{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.oc-lines{font-size:.9rem;margin:0 0 8px;color:var(--ink)}
.oc-actions{display:flex;gap:6px;flex-wrap:wrap}
.order-text{
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:12px;white-space:pre-wrap;font-size:.92rem;margin:8px 0 0;
}
details.past{margin-top:26px}
details.past>summary{cursor:pointer;font-weight:700;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.empty .big{font-size:2rem}

/* summary */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 16px;box-shadow:var(--shadow)}
.stat .n{font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat .l{color:var(--muted);font-size:.8rem;font-weight:600}
table.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sum th{font-size:.78rem;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
table.sum td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:top}
table.sum tr:last-child td{border-bottom:none}
table.sum .num{text-align:center;width:64px;font-weight:700}
table.sum .num.gold{color:var(--gold)}
.tbl-wrap{overflow-x:auto}

.storage-warn{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:.9rem}

.badge.red{background:var(--danger-soft);color:var(--danger)}
tr.prep-row{cursor:pointer}
tr.prep-row:hover td{background:var(--surface2)}
tr.prep-row.done td{opacity:.5;text-decoration:line-through}
.chk{margin-inline-end:4px}
.cap-bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:4px}
.cap-fill{height:100%;background:var(--accent);border-radius:999px}
.cap-fill.full{background:var(--danger)}

/* bon (kitchen/customer ticket) */
#printArea{display:none;direction:rtl}
body.printing #app{display:none!important}
body.printing #printArea{display:block}
.bon{
  max-width:420px;margin:0 auto 16px;background:#fff;color:var(--ink);
  border:2.5px dotted var(--accent);border-radius:16px;padding:20px 22px;font-size:.95rem;
}
.bon-bsd{font-size:.7rem;color:var(--muted);margin-bottom:2px}
.bon-brand{font-size:1.5rem;font-weight:800;text-align:center;margin:0;color:var(--accent)}
.bon-brand svg{vertical-align:-4px}
.bon-sub{text-align:center;color:var(--muted);font-size:.8rem;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.bon-body{white-space:pre-wrap;line-height:1.65}
.bon-total{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;font-weight:800;font-size:1.15rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent)}
.bon-foot{text-align:center;font-size:.8rem;color:var(--muted);margin-top:10px}

/* bag labels */
.labels-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:14px 0}
@media(max-width:420px){.labels-grid{grid-template-columns:1fr}}
.label{
  border:2.5px dotted var(--accent);border-radius:16px;padding:18px 12px;
  text-align:center;background:var(--surface);break-inside:avoid;
}
.label .lb-brand{font-weight:800;color:var(--accent);font-size:.9rem;letter-spacing:.04em}
.label .lb-brand svg{vertical-align:-3px}
.label .lb-kosher{font-size:.72rem;color:var(--muted)}
.label .lb-name{font-size:1.4rem;font-weight:800;margin:8px 0 3px;text-wrap:balance}
.label .lb-meta{font-size:.86rem;color:var(--muted)}
.label .lb-fridge{margin-top:7px;padding-top:6px;border-top:1px dashed var(--line);font-size:.78rem}

/* Brother QL-800 — מדבקת 62מ"מ (DK-11202). named page: לא משפיע על הדפסת בונים/מסמכים */
@page qlabel{size:62mm 29mm;margin:0}

@media print{
  .top,.savebar,.no-print{display:none!important}
  body{background:#fff;color:#000}
  .card,.stat{box-shadow:none;border-color:#bbb;break-inside:avoid}
  .wrap{max-width:none;padding:0}
  .order-text{border-color:#bbb}
  .bon{page-break-inside:avoid}
  .bon+.bon{page-break-before:always}
  .label{border-color:#333;background:#fff;color:#000}
  .label .lb-brand{color:#000}
  .label .lb-meta,.label .lb-kosher{color:#333}
  /* QL-800: כל מדבקת בעמוד 62×29מ"מ בדיוק, grid למסך בלבד */
  body.printing-labels .labels-grid{display:block;margin:0}
  body.printing-labels .label{
    page:qlabel;
    width:62mm;height:29mm;box-sizing:border-box;margin:0;
    border:none;border-radius:0;padding:1.2mm 2.5mm;
    display:flex;flex-direction:column;justify-content:center;gap:.3mm;
    overflow:hidden;page-break-after:always;break-inside:avoid;
  }
  body.printing-labels .label .lb-brand{font-size:8.5pt;line-height:1.1}
  body.printing-labels .label .lb-brand svg{width:10px;height:10px;vertical-align:-1px}
  body.printing-labels .label .lb-kosher{font-size:6pt;line-height:1.1}
  body.printing-labels .label .lb-name{font-size:10pt;margin:.8mm 0 .3mm;line-height:1.12;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  body.printing-labels .label .lb-meta{font-size:7.5pt;line-height:1.18;overflow-wrap:anywhere}
  body.printing-labels .label .lb-fridge{margin-top:.8mm;padding-top:.8mm;font-size:5.5pt;line-height:1.15;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}
</style>

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true" style="flex-shrink:0"><g fill="var(--accent-soft)" stroke="var(--ink)" stroke-width="1.7"><ellipse cx="20" cy="9.5" rx="5.2" ry="8"/><ellipse cx="20" cy="9.5" rx="5.2" ry="8" transform="rotate(72 20 20)"/><ellipse cx="20" cy="9.5" rx="5.2" ry="8" transform="rotate(144 20 20)"/><ellipse cx="20" cy="9.5" rx="5.2" ry="8" transform="rotate(216 20 20)"/><ellipse cx="20" cy="9.5" rx="5.2" ry="8" transform="rotate(288 20 20)"/></g><circle cx="20" cy="20" r="4.6" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.7"/></svg>
        <h1>מטעמי בת מלך</h1>
        <span class="sub">מערכת ניהול הזמנות · מטבח ביתי אותנטי כשר</span>
      </div>
    </div>
  </header>
  <nav class="no-print" id="tabs" aria-label="ניווט ראשי"></nav>
  <main class="wrap" id="view"></main>
</div>
<div id="printArea" dir="rtl" lang="he"></div>

'use strict';
/* ================= menu data ================= */

function buildMenu(){
  const m=(store&&store.menu)||{};
  const arr=(k)=>Array.isArray(m[k])&&m[k].length?m[k].filter(x=>typeof x==='string'&&x.trim()).slice():DEFAULT_MENU[k].slice();
  const num=(k)=>{ const v=Number(m[k]); return Number.isFinite(v)&&v>=0?v:DEFAULT_MENU[k]; };
  MENU={
    salads:arr('salads'), firsts:AUTHORITATIVE_FIRST_COURSE_NAMES.slice(), mains:arr('mains'), sides:arr('sides'), desserts:arr('desserts'),
    extras:(Array.isArray(m.extras)&&m.extras.length
      ?m.extras.filter(x=>x&&typeof x.name==='string'&&x.name.trim()&&!isAutomaticChargeName(x.name)).map(x=>Object.assign({},x,{name:x.name,price:Math.max(0,Number(x.price)||0)}))
      :DEFAULT_MENU.extras.map(x=>({name:x.name,price:x.price}))),
    lunch:DEFAULT_MENU.lunch.map(def=>{
      const it=JSON.parse(JSON.stringify(def));
      const sv=(Array.isArray(m.lunch)?m.lunch:[]).find(x=>x&&x.key===def.key);
      if(!sv) return it;
      if(typeof sv.name==='string'&&sv.name.trim()) it.name=sv.name;
      const pv=v=>{ const n=Number(v); return Number.isFinite(n)&&n>=0?n:null; };
      if(it.price!==undefined&&pv(sv.price)!==null) it.price=pv(sv.price);
      if(it.variants) it.variants=it.variants.map(dv=>{
        const svv=(Array.isArray(sv.variants)?sv.variants:[]).find(x=>x&&x.k===dv.k)||{};
        if(pv(svv.price)!==null) dv.price=pv(svv.price);
        if(dv.sidePrice!==undefined&&pv(svv.sidePrice)!==null) dv.sidePrice=pv(svv.sidePrice);
        if(dv.includedSides!==undefined&&pv(svv.includedSides)!==null) dv.includedSides=pv(svv.includedSides);
        return dv;
      });
      if(it.addon&&sv.addon&&pv(sv.addon.price)!==null) it.addon.price=pv(sv.addon.price);
      return it;
    }),
    lunchSides:(Array.isArray(m.lunchSides)&&m.lunchSides.length?m.lunchSides.filter(x=>typeof x==='string'&&x.trim()):DEFAULT_MENU.lunchSides.slice()),
    couplePrice:num('couplePrice'), challahPrice:num('challahPrice'),
    includedChallot:num('includedChallot'), includedSalads:INCLUDED_SALADS_PER_COUPLE, includedFish:INCLUDED_FISH_UNITS_PER_COUPLE
  };
  OUT_POOL=[...MENU.salads,...MENU.firsts,...MENU.mains,...MENU.sides,...MENU.desserts];
}
function persistMenu(){
  MENU.firsts=AUTHORITATIVE_FIRST_COURSE_NAMES.slice();
  MENU.extras=MENU.extras.filter(ex=>ex&&typeof ex.name==='string'&&!isAutomaticChargeName(ex.name));
  const priorMenu=store.menu&&typeof store.menu==='object'&&!Array.isArray(store.menu)?store.menu:{};
  store.menu=Object.assign({},priorMenu,{
    salads:MENU.salads, firsts:MENU.firsts, mains:MENU.mains, sides:MENU.sides, desserts:MENU.desserts,
    extras:MENU.extras, lunch:MENU.lunch, lunchSides:MENU.lunchSides,
    couplePrice:MENU.couplePrice, challahPrice:MENU.challahPrice,
    includedChallot:MENU.includedChallot, includedSalads:MENU.includedSalads, includedFish:MENU.includedFish
  });
  OUT_POOL=[...MENU.salads,...MENU.firsts,...MENU.mains,...MENU.sides,...MENU.desserts];
  saveStore();
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Math.round(n*100)/100).toLocaleString('en-US')+'$';
const parseMoney=s=>{const n=parseFloat(String(s??'').replace(/[^\d.]/g,''));return isNaN(n)?0:n;};
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(ds){
  if(!ds) return 'ללא תאריך';
  const d=new Date(ds+'T00:00:00');
  if(isNaN(d)) return ds;
  const wd=new Intl.DateTimeFormat('he-IL',{weekday:'long'}).format(d);
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0');
  const yr=(d.getFullYear()!==new Date().getFullYear())?'.'+d.getFullYear():'';
  return `${wd} · ${dd}.${mm}${yr}`;
}
function fmtShort(ds){
  const d=new Date(ds+'T00:00:00');
  if(isNaN(d)) return ds;
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
}
function addDays(ds,n){
  const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function copyText(t){
  const done=()=>toast('הועתק ✓');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t)&&done());
  } else { if(fallbackCopy(t)) done(); }
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); return ok;
}
let toastTimer=null;
function toast(msg){
  let t=$('#toast');
  if(!t){
    t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;bottom:70px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;z-index:99;font-weight:700;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.style.opacity='0';},1800);
}

/* ================= price ================= */
function lunchEntry(d,key){ const e=(d.lunch||{})[key]; return e&&e.q>0?e:null; }
function lunchItemPriceLines(d){
  const lines=[];
  for(const it of MENU.lunch){
    const e=lunchEntry(d,it.key); if(!e) continue;
    if(it.variants){
      const v=it.variants.find(x=>x.k===e.v)||it.variants[0];
      lines.push({l:`${it.name} (${v.label}) ×${e.q}`, a:v.price*e.q});
      if(it.sideChoice){
        const sides=e.sides||{};
        const nSd=Object.values(sides).reduce((s,x)=>s+(x||0),0);
        const incl=(v.includedSides||0)*e.q;
        const over=Math.max(0,nSd-incl);
        if(over>0) lines.push({l:`תוספות לשניצל בצלחת (${over} מעבר לכלול)`, a:over*(v.sidePrice||0)});
      }
    } else {
      lines.push({l:`${it.name} ×${e.q}`, a:it.price*e.q});
    }
    if(it.addon&&(e.addon||0)>0) lines.push({l:`${it.addon.name} (לקוסקוס) ×${e.addon}`, a:it.addon.price*e.addon});
  }
  return lines;
}
function computeSuggested(d){
  const lines=[];
  if(d.meals>0) lines.push({l:`ארוחה זוגית ×${d.meals}`, a:MENU.couplePrice*d.meals});
  // סלטים מעבר לכלול (פינוקים לא מחויבים): בלוק 4 = 25$, שארית 1-3 = 7$ לסלט
  const nS=countSaladsOrdered(d);
  const inclS=INCLUDED_SALADS_PER_COUPLE*(d.meals||0);
  const overS=Math.max(0,nS-inclS);
  if(overS>0){
    const blocks=Math.floor(overS/4), rem=overS%4;
    lines.push({l:`סלטים נוספים (${overS} מעבר לכלול)`, a:blocks*SALAD_BLOCK_PRICE+rem*SALAD_PRICE});
  }
  const fishUnits=countFish(d);
  const includedFishUnits=INCLUDED_FISH_UNITS_PER_COUPLE*(d.meals||0);
  const extraFishUnits=Math.max(0,fishUnits-includedFishUnits);
  if(extraFishUnits>0) lines.push({l:`יחידות דג נוספות (${extraFishUnits} מעבר לכלול)`, a:extraFishUnits*EXTRA_FISH_UNIT_PRICE});
  for(const ex of MENU.extras){
    if(isAutomaticChargeName(ex.name)) continue;
    const e=d.extras[ex.name];
    if(e && e.q>0) lines.push({l:`${ex.name} ×${e.q}`, a:ex.price*e.q});
  }
  for(const c of d.custom){
    const q=Number(c.qty)||0, p=parseMoney(c.price);
    if(c.name && q>0&&!isAutomaticChargeName(c.name)) lines.push({l:`${c.name} ×${q}`, a:p*q});
  }
  for(const ln of lunchItemPriceLines(d)) lines.push(ln);
  const included=MENU.includedChallot*(d.meals||0);
  const extraCh=Math.max(0,(d.challot||0)-included);
  if(extraCh>0) lines.push({l:`חלות נוספות ×${extraCh}`, a:MENU.challahPrice*extraCh});
  if(!d.pickup) lines.push({l:'משלוח ברחבי דובאי', a:DELIVERY_PRICE});
  const total=lines.reduce((s,x)=>s+x.a,0);
  return {lines,total};
}
function countSaladsOrdered(d){ return Object.values(d.salads).reduce((s,x)=>s+(x.o||0),0); }
function countSaladsPinuk(d){ return Object.values(d.salads).reduce((s,x)=>s+(x.p||0),0); }
function countFish(d){
  return Object.entries(d.firsts).reduce((s,[name,qty])=>s+(qty||0)*(canonicalName(name)===canonicalName(FISH_CAKES_NAME)?2:1),0);
}
function dessertAllowance(d){
  let souffleQuantity=0, baklavaQuantity=0, unclassifiedQuantity=0;
  for(const [name,rawQuantity] of Object.entries(d.desserts||{})){
    const quantity=Math.max(0,Number(rawQuantity)||0);
    if(quantity===0) continue;
    const normalized=canonicalName(name);
    if(normalized.includes('סופלה')) souffleQuantity+=quantity;
    else if(/בקל/u.test(normalized)) baklavaQuantity+=quantity;
    else unclassifiedQuantity+=quantity;
  }
  const selectedHalfUnits=souffleQuantity+baklavaQuantity*2;
  const includedHalfUnits=Math.max(0,Number(d.meals)||0)*2;
  return {
    souffleQuantity,
    baklavaQuantity,
    unclassifiedQuantity,
    selectedHalfUnits,
    includedHalfUnits,
    excessHalfUnits:Math.max(0,selectedHalfUnits-includedHalfUnits)
  };
}
function parseUsdMinorUnits(value){
  const normalized=String(value??'').trim();
  if(!/^(?:0|[1-9]\d*)(?:\.\d{1,2})?$/u.test(normalized)) return null;
  const [whole,fraction='']=normalized.split('.');
  const minor=Number(whole)*100+Number(fraction.padEnd(2,'0'));
  return Number.isSafeInteger(minor)?minor:null;
}
function calculatedMinorUnits(value){
  if(!Number.isFinite(value)||value<0) return null;
  const scaled=value*100;
  const rounded=Math.round(scaled);
  return Number.isSafeInteger(rounded)&&Math.abs(scaled-rounded)<1e-7?rounded:null;
}

function lunchTextLines(o){
  const out=[];
  for(const it of MENU.lunch){
    const e=lunchEntry(o,it.key); if(!e) continue;
    let line=it.name;
    if(it.variants){
      const v=it.variants.find(x=>x.k===e.v)||it.variants[0];
      line+=` (${v.label})`;
    }
    line+=` ×${e.q}`;
    const parts=[];
    if(it.sideChoice){
      const sp=Object.entries(e.sides||{}).filter(([,q])=>q>0).map(([n,q])=>`${n}${q>1?` ×${q}`:''}`);
      if(sp.length) parts.push('תוספות: '+sp.join(', '));
    }
    if(it.addon&&(e.addon||0)>0) parts.push(`+ ${it.addon.name} ×${e.addon}`);
    if(parts.length) line+=' — '+parts.join(' · ');
    out.push(line);
  }
  return out;
}

/* ================= order text (like the Word card) ================= */
function waLink(phone){
  let p=String(phone||'').replace(/\D/g,'');
  if(!p) return '';
  if(p.startsWith('00')) p=p.slice(2);
  if(p.startsWith('0')) p='972'+p.slice(1);
  return 'https://wa.me/'+p;
}
function orderShortDest(o){
  if(o.pickup) return 'איסוף עצמי';
  return (o.place||'—') + (o.time?` · ${o.time}`:'');
}
function buildOrderText(o){
  const L=[];
  L.push(`ההזמנה לתאריך: ${fmtDate(o.date)}`);
  L.push(`שם מלא: ${o.name||'—'}`);
  if(o.phone) L.push(`מס' טלפון: ${o.phone}`);
  L.push(`לאן המשלוח? ${o.pickup?'איסוף עצמי':(o.place||'—')}${(!o.pickup&&o.time)?` (הגעה: ${o.time})`:''}`);
  if(!o.pickup&&o.address) L.push(`כתובת: ${o.address}`);
  if(o.group) L.push(`קבוצה: ${o.group}`);
  if(o.meals>0) L.push(`ארוחה זוגית ×${o.meals}`);
  const saladLines=[];
  for(const name of Object.keys(o.salads)){
    const s=o.salads[name];
    if(s.o>0) saladLines.push(`${name}${s.o>1?` ×${s.o}`:''}`);
  }
  for(const name of Object.keys(o.salads)){
    const s=o.salads[name];
    if(s.p>0) saladLines.push(`${name}${s.p>1?` ×${s.p}`:''} — פינוק 🎁`);
  }
  if(saladLines.length){
    L.push('סלטים:');
    saladLines.forEach((s,i)=>L.push(`  ${i+1}. ${s}`));
  }
  const firstParts=Object.keys(o.firsts).filter(k=>o.firsts[k]>0).map(k=>`${k} ×${o.firsts[k]}`);
  if(firstParts.length){
    let line=`ראשונה: ${firstParts.join(', ')}`;
    if(o.heat) line+=` (${o.heat})`;
    L.push(line);
    if(o.firstsNote) L.push(`  הערה: ${o.firstsNote}`);
  }
  const mainParts=Object.keys(o.mains).filter(k=>o.mains[k]>0).map(k=>`${k}${o.mains[k]>1?` ×${o.mains[k]}`:''}`);
  if(mainParts.length){
    L.push(`עיקרית: ${mainParts.join(', ')}`);
    if(o.mainsNote) L.push(`  הערה: ${o.mainsNote}`);
  }
  const sideParts=Object.keys(o.sides).filter(k=>o.sides[k]>0).map(k=>`${k}${o.sides[k]>1?` ×${o.sides[k]}`:''}`);
  if(sideParts.length) L.push(`תוספת: ${sideParts.join(', ')}`);
  const desParts=Object.keys(o.desserts).filter(k=>o.desserts[k]>0).map(k=>`${k}${o.desserts[k]>1?` ×${o.desserts[k]}`:''}`);
  if(desParts.length) L.push(`קינוח: ${desParts.join(', ')}`);
  const exLines=[];
  for(const name of Object.keys(o.extras)){
    const e=o.extras[name];
    if(e.q>0) exLines.push(`${name} ×${e.q}${e.note?` (${e.note})`:''}`);
  }
  for(const c of o.custom){ if(c.name && (Number(c.qty)||0)>0) exLines.push(`${c.name} ×${c.qty}${c.price?` (${parseMoney(c.price)}$)`:''}${c.note?` — ${c.note}`:''}`); }
  if(exLines.length){ L.push('אקסטרה:'); exLines.forEach(x=>L.push(`  • ${x}`)); }
  const lunchLines=lunchTextLines(o);
  if(lunchLines.length){ L.push('תפריט צהריים:'); lunchLines.forEach(x=>L.push(`  • ${x}`)); }
  if(o.aricha>0) L.push(`עריכה: ${o.aricha} איש`);
  if(o.challot>0) L.push(`חלות: ${o.challot} יח'`);
  if(o.total) L.push(`סך לתשלום: ${parseMoney(o.total)}$`);
  if(o.deposit) L.push(`מקדמה: ${parseMoney(o.deposit)}$`);
  if(o.payMethod) L.push(`דרך תשלום: ${o.payMethod}`);
  L.push(`שולם: ${o.paid||'לא'}`);
  if(o.notes) L.push(`הערות: ${o.notes}`);
  return L.join('\n');
}

let printCleanupTimer=null;
function printHtml(html,mode){
  const pa=$('#printArea'); if(!pa) return;
  pa.innerHTML=html;
  document.body.classList.add('printing');
  if(mode==='labels') document.body.classList.add('printing-labels'); // @page qlabel 62מ"מ
  const done=()=>{
    document.body.classList.remove('printing');
    document.body.classList.remove('printing-labels');
    pa.innerHTML='';
    window.removeEventListener('afterprint',done);
    clearTimeout(printCleanupTimer);
  };
  window.addEventListener('afterprint',done);
  printCleanupTimer=setTimeout(done,3000);
  window.print();
}

function nextFridayIso(){
  const d=new Date();
  while(d.getDay()!==5) d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function buildPromoText(){
  const nf=nextFridayIso();
  const max=store.settings.maxMeals||0;
  const booked=store.orders.filter(o=>o.date===nf&&!isCancelled(o)).reduce((s,o)=>s+(o.meals||0),0);
  const L=[`🕯️✨ מטעמי בת מלך — שבת קודש ${fmtShort(nf)} ✨🕯️`,'',
    `ארוחה זוגית מפנקת לשבת — ${MENU.couplePrice}$`,
    `כוללת: ${MENU.includedSalads} סלטים לבחירה 🥗 זוג דגי ראשונה 🐟 עיקרית ותוספת לבחירה 🍖 קינוח 🍫 זוג חלות ביתיות 🥖 וערכת אירוח מהודרת לשבת`];

function parseFreeText(raw){
  raw=String(raw||'').trim();
  if(!raw) return null;
  const t=(' '+raw+' ').replace(/[‏‎]/g,'');
  const d=newDraft(); d.meals=0; d.challot=0;
  let hits=0;
  const num=re=>{ const m=t.match(re); return m?parseInt(m[1],10):null; };
  const qtyNear=alias=>{
    const es=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const m=t.match(new RegExp('(\\d+)\\s*(?:מגשי?\\s+|מנות\\s+)?'+es));
    return m?parseInt(m[1],10):1;
  };
  if(/ארוח(ה|ות)\s+זוגי|זוגית/.test(t)){
    d.meals=num(/(\d+)\s*ארוחות/)||1; hits++;
    d.challot=MENU.includedChallot*d.meals;
  }
  const ch=num(/(\d+)\s*חלות/);
  if(ch!==null){ d.challot=ch; hits++; }
  else if(/חלה\s+אחת|עוד\s+חלה/.test(t)){ d.challot+=1; hits++; }
  if(/כל\s+(סוגי\s+)?הסלטים/.test(t)){
    for(const n of MENU.salads) d.salads[n]={o:1,p:0};
    hits++;
  } else {
    for(const [n,aliases] of Object.entries(FT_ALIASES.salads)){
      if(!MENU.salads.includes(n)) continue;
      for(const a of aliases){ if(t.includes(a)){ d.salads[n]={o:qtyNear(a),p:0}; hits++; break; } }
    }
  }
  // fish — strip non-fish "מרוקאי" contexts first
  const tf=t.replace(/גזר\s+מרוקאי|עוף\s+מרוקאי|משוויה\s+מרוקאית|ברוטב\s+מרוקאי|תבשיל\s+מרוקאי/g,'');
  if(/מרוקאי/.test(tf)&&MENU.firsts[0]){
    const m=tf.match(/(\d+)\s*(?:דג(?:ים)?\s+)?מרוקאי/);
    d.firsts[MENU.firsts[0]]=m?parseInt(m[1],10):1; hits++;
  }
  if(/חריימה/.test(t)&&MENU.firsts[1]){
    const m=t.match(/(\d+)\s*(?:דג(?:ים)?\s+)?חריימה/);
    d.firsts[MENU.firsts[1]]=m?parseInt(m[1],10):1; hits++;
  }
  if(/קציצות\s+דגים/.test(t)&&MENU.firsts[2]){ d.firsts[MENU.firsts[2]]=qtyNear('קציצות דגים'); hits++; }
  if(/לא\s+חריף/.test(t)){ d.heat='לא חריף'; hits++; }
  else if(/מעורב|חלק\s+חריף/.test(t)){ d.heat='מעורב — חלק חריף וחלק לא'; hits++; }
  else if(/חריף/.test(t.replace(/פלפל\s+חריף|שרי\s+חריפות|צלחת\s+חריפים/g,''))){ d.heat='חריף'; hits++; }
  for(const [group,aliases] of [['mains',FT_ALIASES.mains],['sides',FT_ALIASES.sides],['desserts',FT_ALIASES.desserts]]){
    for(const [n,as] of Object.entries(aliases)){
      if(!MENU[group].includes(n)) continue;
      for(const a of as){ if(t.includes(a)){ d[group][n]=qtyNear(a); hits++; break; } }
    }
  }
  const exNames=MENU.extras.map(x=>x.name);
  for(const [n,as] of Object.entries(FT_ALIASES.extras)){
    if(!exNames.includes(n)) continue;
    for(const a of as){ if(t.includes(a)){ d.extras[n]={q:qtyNear(a),note:''}; hits++; break; } }
  }
  const ar=num(/עריכה\s*ל?[־-]?\s*(\d+)/); if(ar){ d.aricha=ar; hits++; }
  if(/איסוף\s+עצמי/.test(t)){ d.pickup=true; hits++; }
  if(!d.pickup){
    const known=[...new Set(store.orders.map(o=>o.place).filter(Boolean))];
    for(const h of known){ if(t.includes(h)){ d.place=h; hits++; break; } }
    if(!d.place){
      const hm=raw.match(/(?:ל?מלון|ב?מלון)\s+([^\n,.]{2,30})/);
      if(hm){ d.place=hm[1].trim(); hits++; }
    }
  }
  const ph=raw.match(/(?:\+?971|0)5\d[\d\- ]{6,10}/);
  if(ph){ d.phone=ph[0].trim(); hits++; }
  const tm=raw.match(/\b([01]?\d|2[0-3]):[0-5]\d\b/);
  if(tm){ d.time=tm[0]; hits++; }
  const dm=raw.match(/\b(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?\b/);
  if(dm&&!(tm&&tm[0]===dm[0])){
    let y=new Date().getFullYear();
    if(dm[3]) y=dm[3].length===2?2000+parseInt(dm[3],10):parseInt(dm[3],10);
    const ds=y+'-'+String(parseInt(dm[2],10)).padStart(2,'0')+'-'+String(parseInt(dm[1],10)).padStart(2,'0');
    d.date=(!dm[3]&&ds<todayStr())?(y+1)+ds.slice(4):ds;
    hits++;
  } else if(/שישי|שבת/.test(t)){ d.date=nextFridayIso(); hits++; }
  const nm=raw.match(/שם(?:\s+מלא)?\s*[:\-]\s*([^\n,]{2,30})/);
  if(nm){ d.name=nm[1].trim(); hits++; }
  if(!hits) return null;
  d.notes=('הודעת הלקוח: '+raw).slice(0,400);
  return d;
}
function applyImported(p){
  const d=newDraft();
  for(const k of ['date','name','phone','place','address','time','heat','firstsNote','mainsNote','notes']){
    if(typeof p[k]==='string') d[k]=p[k];
  }
  if(typeof p.pickup==='boolean') d.pickup=p.pickup;
  for(const k of ['meals','aricha','challot']){
    if(typeof p[k]==='number'&&p[k]>=0) d[k]=Math.floor(p[k]);
  }
  const qtyMap=(src,allowed)=>{
    const out={};
    if(src&&typeof src==='object') for(const [n,q] of Object.entries(src)){
      if(allowed.includes(n)&&typeof q==='number'&&q>0) out[n]=Math.floor(q);
    }
    return out;
  };
  if(p.salads&&typeof p.salads==='object'){
    for(const [n,q] of Object.entries(p.salads)){
      if(MENU.salads.includes(n)&&typeof q==='number'&&q>0) d.salads[n]={o:Math.floor(q),p:0};
    }
  }
  d.firsts=qtyMap(p.firsts,MENU.firsts);
  d.mains=qtyMap(p.mains,MENU.mains);
  d.sides=qtyMap(p.sides,MENU.sides);
  d.desserts=qtyMap(p.desserts,MENU.desserts);
  if(p.extras&&typeof p.extras==='object'){
    const names=MENU.extras.map(x=>x.name);
    for(const [n,e] of Object.entries(p.extras)){
      if(names.includes(n)&&e&&typeof e.q==='number'&&e.q>0) d.extras[n]={q:Math.floor(e.q),note:typeof e.note==='string'?e.note:''};
    }
  }
  if(Array.isArray(p.custom)){
    d.custom=p.custom.filter(c=>c&&typeof c.name==='string'&&c.name.trim())
      .map(c=>({name:c.name,qty:Math.max(0,Math.floor(Number(c.qty)||0)),price:String(c.price??''),note:typeof c.note==='string'?c.note:''}));
  }
  if(p.lunch&&typeof p.lunch==='object'){
    for(const it of MENU.lunch){
      const e=p.lunch[it.key];
      if(!e||typeof e.q!=='number'||e.q<=0) continue;
      const ne={q:Math.floor(e.q),v:'',sides:{},addon:0};
      if(it.variants&&typeof e.v==='string'&&it.variants.some(x=>x.k===e.v)) ne.v=e.v;
      if(it.sideChoice&&e.sides&&typeof e.sides==='object'){
        for(const [n,q] of Object.entries(e.sides)) if(MENU.lunchSides.includes(n)&&typeof q==='number'&&q>0) ne.sides[n]=Math.floor(q);
      }
      if(it.addon&&typeof e.addon==='number'&&e.addon>0) ne.addon=Math.floor(e.addon);
      d.lunch[it.key]=ne;
    }
  }
  return d;
}

function refreshFormDerived(){
  const d=draft; if(!d) return;
  const inclS=INCLUDED_SALADS_PER_COUPLE*(d.meals||0);
  const nO=countSaladsOrdered(d), nP=countSaladsPinuk(d);
  const bS=$('[data-badge="salads"]');
  if(bS) bS.textContent=inclS>0?`${nO}/${inclS} כלולים · 🎁 ${nP}`:`${nO} הוזמנו · 🎁 ${nP}`;
  const inclF=INCLUDED_FISH_UNITS_PER_COUPLE*(d.meals||0);
  const nF=countFish(d);
  const bF=$('[data-badge="firsts"]');
  if(bF) bF.textContent=inclF>0?`${nF}/${inclF} כלולים`:`${nF}`;
  const nM=Object.values(d.mains).reduce((s,x)=>s+x,0);
  const bM=$('[data-badge="mains"]'); if(bM) bM.textContent=nM||'';
  const nSd=Object.values(d.sides).reduce((s,x)=>s+x,0);
  const bSd=$('[data-badge="sides"]'); if(bSd) bSd.textContent=nSd||'';
  const nDs=Object.values(d.desserts).reduce((s,x)=>s+x,0);
  const bDs=$('[data-badge="desserts"]'); if(bDs) bDs.textContent=nDs||'';
  const bCh=$('[data-badge="challot"]');
  if(bCh) bCh.textContent=d.meals>0?`(כלולות בזוגית: ${MENU.includedChallot*d.meals})`:'';
  updatePriceHint();
}
function updatePriceHint(){
  const el=$('#priceHint'); if(!el||!draft) return;
  const sug=computeSuggested(draft);
  const warns=[];
  const inclS=INCLUDED_SALADS_PER_COUPLE*(draft.meals||0);
  const nO=countSaladsOrdered(draft);
  if(nO>inclS) warns.push(`הוזמנו ${nO-inclS} סלטים מעבר לכלול — החיוב נוסף אוטומטית למחיר המוצע (${SALAD_PRICE}$ לסלט, ${SALAD_BLOCK_PRICE}$ לבלוק 4).`);
  const inclF=INCLUDED_FISH_UNITS_PER_COUPLE*(draft.meals||0);
  const nF=countFish(draft);
  if(nF>inclF) warns.push(`הוזמנו ${nF-inclF} יחידות דג מעבר לכלול — החיוב נוסף אוטומטית למחיר המוצע (${EXTRA_FISH_UNIT_PRICE}$ ליחידה).`);
  const selectedMains=Object.values(draft.mains||{}).reduce((sum,quantity)=>sum+(Number(quantity)||0),0);
  if(selectedMains>(draft.meals||0)) warns.push('בחירת העיקריות חורגת ממנה אחת לכל זוגית — אי אפשר לשמור עד שיוגדר מחיר מאושר לחריגה.');
  const selectedSides=Object.values(draft.sides||{}).reduce((sum,quantity)=>sum+(Number(quantity)||0),0);
  if(selectedSides>(draft.meals||0)) warns.push('בחירת התוספות חורגת מתוספת אחת לכל זוגית — אי אפשר לשמור עד שיוגדר מחיר מאושר לחריגה.');
  const dessert=dessertAllowance(draft);
  if(dessert.unclassifiedQuantity>0) warns.push('יש קינוח שאי אפשר לשייך בבטחה לזכאות — אי אפשר לשמור עד שהבחירה תתוקן.');
  if(dessert.excessHalfUnits>0) warns.push('בחירת הקינוחים חורגת מהזכאות — אי אפשר לשמור עד שיוגדר מחיר מאושר לחריגה.');
  if((draft.custom||[]).some(c=>c&&isAutomaticChargeName(c.name)&&(Number(c.qty)||0)>0)){
    warns.push('נוסף פריט חופשי שמחושב אוטומטית — הוא לא יחויב פעמיים, ויש להסיר אותו לפני השמירה.');
  }
  const max=store.settings.maxMeals||0;
  if(max>0&&draft.date&&draft.meals>0&&draft.status!=='בוטלה'){
    const others=store.orders.filter(o=>o.date===draft.date&&o.id!==draft.id&&!isCancelled(o)).reduce((s,o)=>s+(o.meals||0),0);
    const tot=others+draft.meals;
    if(tot>max) warns.push(`עומס! עם ההזמנה הזאת יהיו ${tot} זוגיות ב־${fmtShort(draft.date)} — מעבר לתקרה שקבעת (${max}).`);
    else if(tot===max) warns.push(`התאריך ${fmtShort(draft.date)} מתמלא: ${tot}/${max} זוגיות.`);
  }
  // אזהרת חלת שניצל ביום חול (לא חוסמת)
  const roll=(draft.lunch||{})['schnitzel-roll'];
  if(roll&&roll.q>0&&roll.v==='challah'&&draft.date){
    const day=new Date(draft.date+'T00:00:00').getDay();
    if(day!==5&&day!==6) warns.push('חלת שניצל זמינה בסופ"ש בלבד — נבחרה ליום חול, לתאם מול הלקוח.');
  }
  let html='';
  if(draft.meals>0){
    html+=`<div class="hint" style="margin-bottom:6px">כלול במנה הזוגית (בלי חיוב נוסף): ${inclS} סלטים · ${INCLUDED_FISH_UNITS_PER_COUPLE*(draft.meals||0)} יחידות דג · ${draft.meals} עיקרית · ${draft.meals} תוספת · ${MENU.includedChallot*draft.meals} חלות${MENU.includedChallot*draft.meals<(draft.challot||0)?` (מעבר לכך — חלה ${MENU.challahPrice}$)`:''}.</div>`;
  }
  if(sug.lines.length){
    html+=`<div class="hint" style="margin-bottom:8px">מחיר מוצע לפי המחירון: `+
      sug.lines.map(l=>`${esc(l.l)} = ${l.a}$`).join(' · ')+
      ` · <b>סה"כ ${sug.total}$</b> <button type="button" class="btn sm" data-act="useSuggested" data-total="${sug.total}">להשתמש במחיר הזה</button></div>`;
  }
  html+=warns.map(w=>`<div class="warn">⚠️ ${esc(w)}</div>`).join('');
  el.innerHTML=html;
}

/* ================= bump ================= */
function bump(g,i,k,delta){
  const d=draft; if(!d) return 0;
  let nv=0;
  if(g==='meals'){
    const previousMeals=d.meals||0;
    const previousAutomaticChallahs=MENU.includedChallot*previousMeals;
    nv=Math.max(0,previousMeals+delta); d.meals=nv;
    if((d.challot||0)===previousAutomaticChallahs) d.challot=MENU.includedChallot*nv;
  } else if(g==='challot'||g==='aricha'){
    nv=Math.max(0,(d[g]||0)+delta); d[g]=nv;
  } else if(g==='salads'){
    const name=MENU.salads[i];
    const s=d.salads[name]||(d.salads[name]={o:0,p:0});
    s[k]=Math.max(0,(s[k]||0)+delta); nv=s[k];
    if(!s.o&&!s.p) delete d.salads[name];
  } else if(g==='firsts'||g==='mains'||g==='sides'||g==='desserts'){
    const name=MENU[g][i];
    nv=Math.max(0,(d[g][name]||0)+delta);
    if(nv===0) delete d[g][name]; else d[g][name]=nv;
  } else if(g==='extras'){
    const name=MENU.extras[i].name;
    const e=d.extras[name]||(d.extras[name]={q:0,note:''});
    e.q=Math.max(0,e.q+delta); nv=e.q;
    if(e.q===0&&!e.note) delete d.extras[name];
  } else if(g==='lunch'){
    const it=MENU.lunch[i];
    const e=d.lunch[it.key]||(d.lunch[it.key]={q:0,v:'',sides:{},addon:0});
    nv=Math.max(0,e.q+delta); e.q=nv;
    if(
      nv>0 && Object.keys(d.lunch).filter(key=>key!==it.key&&d.lunch[key]&&d.lunch[key].q>0).length===0 &&
      d.meals===1 && d.challot===MENU.includedChallot &&
      ['salads','firsts','mains','sides','desserts'].every(group=>Object.keys(d[group]||{}).length===0)
    ){
      d.meals=0;
      d.challot=0;
    }
    if(nv===0) delete d.lunch[it.key];
  } else if(g==='lunchSides'){
    const it=MENU.lunch[i], e=d.lunch[it.key];
    if(e){
      const sn=MENU.lunchSides[Number(String(k).slice(1))];
      if(sn!==undefined){
        e.sides=e.sides||{};
        nv=Math.max(0,(e.sides[sn]||0)+delta);
        if(nv===0) delete e.sides[sn]; else e.sides[sn]=nv;
      }
    }
  } else if(g==='lunchAddon'){
    const it=MENU.lunch[i], e=d.lunch[it.key];
    if(e){ nv=Math.max(0,(e.addon||0)+delta); e.addon=nv; }
  }
  return nv;
}

/* ================= render: summary ================= */
function aggregate(list){
  const agg={
    orders:list.length, meals:0, aricha:0, challot:0,
    salads:{}, firsts:{}, mains:{}, sides:{}, desserts:{}, extras:[], lunch:[],
    heatNotes:[], generalNotes:[],
    revenue:0, deposits:0, owed:0
  };
  for(const o of list){
    agg.meals+=o.meals||0; agg.aricha+=o.aricha||0; agg.challot+=o.challot||0;
    for(const [n,s] of Object.entries(o.salads)){
      const a=agg.salads[n]||(agg.salads[n]={o:0,p:0});
      a.o+=s.o||0; a.p+=s.p||0;
    }
    for(const [n,q] of Object.entries(o.firsts)) agg.firsts[n]=(agg.firsts[n]||0)+q;
    for(const [n,q] of Object.entries(o.mains)) agg.mains[n]=(agg.mains[n]||0)+q;
    for(const [n,q] of Object.entries(o.sides)) agg.sides[n]=(agg.sides[n]||0)+q;
    for(const [n,q] of Object.entries(o.desserts)) agg.desserts[n]=(agg.desserts[n]||0)+q;
    for(const [n,e] of Object.entries(o.extras)){
      if(e.q>0) agg.extras.push({who:o.name, what:n, q:e.q, note:e.note, date:o.date});
    }
    for(const c of o.custom){ if(c.name&&(Number(c.qty)||0)>0) agg.extras.push({who:o.name, what:c.name, q:Number(c.qty)||0, note:[c.price?`${parseMoney(c.price)}$`:'',c.note||''].filter(Boolean).join(' · '), date:o.date}); }
    for(const it of MENU.lunch){
      const e=lunchEntry(o,it.key); if(!e) continue;
      let what=it.name;
      let v=null;
      if(it.variants){ v=it.variants.find(x=>x.k===e.v)||it.variants[0]; what+=` (${v.label})`; }
      const sp=(it.sideChoice?Object.entries(e.sides||{}).filter(([,q])=>q>0).map(([n,q])=>`${n}${q>1?` ×${q}`:''}`):[]);
      agg.lunch.push({who:o.name, what, q:e.q, note:sp.join(', '), date:o.date});
      if(it.sideChoice) for(const [n,q] of Object.entries(e.sides||{})) if(q>0) agg.sides[n]=(agg.sides[n]||0)+q;
      if(it.addon&&(e.addon||0)>0) agg.lunch.push({who:o.name, what:'+ '+it.addon.name+' (לקוסקוס)', q:e.addon, note:'', date:o.date});
    }
    if(o.heat||o.firstsNote) agg.heatNotes.push({who:o.name, txt:[o.heat,o.firstsNote].filter(Boolean).join(' · '), date:o.date});
    if(o.mainsNote) agg.generalNotes.push({who:o.name, txt:'עיקרית: '+o.mainsNote, date:o.date});
    if(o.notes) agg.generalNotes.push({who:o.name, txt:o.notes, date:o.date});
    const tot=parseMoney(o.total), dep=parseMoney(o.deposit);
    agg.revenue+=tot; agg.deposits+=dep;
    if(o.paid!=='כן'&&o.paid!=='שת"פ') agg.owed+=Math.max(0,tot-dep);
  }
  return agg;
}
function breakdowns(list){
  const bd={salads:{},firsts:{},mains:{},sides:{},desserts:{},challot:{}};
  const add=(cat,n,dt,q)=>{ const m=bd[cat][n]=bd[cat][n]||{}; m[dt]=(m[dt]||0)+q; };
  for(const o of list){
    const dt=o.date;
    for(const [n,s] of Object.entries(o.salads)) add('salads',n,dt,(s.o||0)+(s.p||0));
    for(const [n,q] of Object.entries(o.firsts)) add('firsts',n,dt,q);
    for(const [n,q] of Object.entries(o.mains)) add('mains',n,dt,q);
    for(const [n,q] of Object.entries(o.sides)) add('sides',n,dt,q);
    for(const [n,q] of Object.entries(o.desserts)) add('desserts',n,dt,q);
    if(o.challot>0) bd.challot[dt]=(bd.challot[dt]||0)+o.challot;
  }
  return bd;
}
function bdLine(bdMap,n){
  if(!bdMap||!bdMap[n]) return '';
  const parts=Object.entries(bdMap[n]).sort().map(([dt,q])=>`${fmtShort(dt)}: ${q}`);
  return `<div class="hint">${esc(parts.join(' · '))}</div>`;
}
function prepMap(dateKey){ return store.prepDone[dateKey]||(store.prepDone[dateKey]={}); }
function sumTable(title, obj, opts){
  opts=opts||{};
  const rows=Object.entries(obj).filter(([,v])=>(typeof v==='object'?(v.o||v.p):v)>0);
  if(!rows.length) return '';
  const bd=opts.bd||null;
  const chk=opts.check||null; // {cat, dateKey}
  const done=chk?prepMap(chk.dateKey):null;
  const rowOpen=n=>{
    if(!chk) return '<tr>';
    const key=chk.cat+'|'+n;
    return `<tr class="prep-row${done[key]?' done':''}" data-check="${esc(key)}">`;
  };
  const mark=n=>chk?`<span class="chk">${done[chk.cat+'|'+n]?'✅':'⬜'}</span>`:'';
  const doneCount=chk?rows.filter(([n])=>done[chk.cat+'|'+n]).length:0;
  const prog=chk?` <span class="badge${doneCount===rows.length?' gold':''}">${doneCount}/${rows.length} ✓</span>`:'';
  if(opts.pinukCols){
    return `<div class="card"><div class="sec-h">${title}${prog}</div><div class="tbl-wrap"><table class="sum">
      <tr><th>סלט</th><th class="num">הוזמן</th><th class="num">🎁 פינוק</th><th class="num">סה"כ</th></tr>
      ${rows.map(([n,v])=>`${rowOpen(n)}<td>${mark(n)}${esc(n)}${bdLine(bd,n)}</td><td class="num">${v.o||''}</td><td class="num gold">${v.p||''}</td><td class="num">${(v.o||0)+(v.p||0)}</td></tr>`).join('')}
      <tr><td><b>סה"כ סלטים</b></td><td class="num"><b>${rows.reduce((s,[,v])=>s+(v.o||0),0)}</b></td><td class="num gold"><b>${rows.reduce((s,[,v])=>s+(v.p||0),0)}</b></td><td class="num"><b>${rows.reduce((s,[,v])=>s+(v.o||0)+(v.p||0),0)}</b></td></tr>
    </table></div></div>`;
  }
  return `<div class="card"><div class="sec-h">${title}${prog}</div><div class="tbl-wrap"><table class="sum">
    <tr><th>מנה</th><th class="num">כמות</th></tr>
    ${rows.map(([n,v])=>`${rowOpen(n)}<td>${mark(n)}${esc(n)}${bdLine(bd,n)}</td><td class="num">${v}</td></tr>`).join('')}
  </table></div></div>`;
}
function summaryScope(){
  const dates=[...new Set(store.orders.map(o=>o.date).filter(Boolean))].sort();
  const t=todayStr();
  let sel=view.summaryDate;
  if(!sel||(sel!=='next7'&&sel!=='upcoming'&&!dates.includes(sel))){
    const hasNext7=store.orders.some(o=>o.date&&o.date>=t&&o.date<=addDays(t,7));
    sel=view.summaryDate=hasNext7?'next7':(dates.find(d=>d>=t)||dates[dates.length-1]);
  }
  let list,title;
  if(sel==='upcoming'){
    list=store.orders.filter(o=>o.date&&o.date>=t);
    title='כל ההזמנות הקרובות';
  } else if(sel==='next7'){
    const end=addDays(t,7);
    list=store.orders.filter(o=>o.date&&o.date>=t&&o.date<=end);
    title=`השבוע הקרוב (${fmtShort(t)}–${fmtShort(end)})`;
  } else {
    list=store.orders.filter(o=>o.date===sel);
    title=fmtDate(sel);
  }
  list=sortOrders(list.filter(o=>!isCancelled(o)));
  const scopeDates=[...new Set(list.map(o=>o.date))].sort();
  return {sel, dates, list, title, multi:scopeDates.length>1, scopeDates};
}

  }
  const block=(bTitle,obj,cat)=>{

    for(const [n,q] of rows) L.push(`  • ${n}: ${q}${bdTxt(cat,n)}`);

  if(agg.extras.length){
    L.push('✨ אקסטרות:');

  if(agg.lunch.length){
    L.push('🌞 תפריט צהריים:');

    L.push('');
  }
  if(agg.heatNotes.length||agg.generalNotes.length){
    L.push('📌 הערות:');

    for(const n of agg.generalNotes) L.push(`  • ${n.who} — ${n.txt}`);

  for(const o of list) L.push(`  • ${multi?fmtShort(o.date)+' — ':''}${o.time&&!o.pickup?o.time+' — ':''}${o.name} — ${o.pickup?'איסוף עצמי':(o.place||'—')}${o.phone?' — '+o.phone:''}`);
  L.push('');
  L.push(`💰 סה"כ: ${money(agg.revenue)} · נשאר לגבות: ${money(agg.owed)}`);
  return L.join('\n');
}

function fmtMonth(m){ return m.slice(5,7)+'.'+m.slice(0,4); }

    ...store.orders.filter(o=>o.date).map(o=>o.date.slice(0,7)),

  ].map(d=>d.slice(0,7)))].sort();

    return;
  }
  let sel=view.moneyMonth;
  if(!sel||!months.includes(sel)) sel=view.moneyMonth=(months.filter(m=>m<=t.slice(0,7)).pop()||months[0]);

    ...monthOrders.map(o=>o.date),

  const revenue=monthOrders.reduce((s,o)=>s+parseMoney(o.total),0);

    <div class="stat"><div class="n">${meals}</div><div class="l">ארוחות זוגיות</div></div>
    <div class="stat"><div class="n">${money(owed)}</div><div class="l">עוד לא נגבה</div></div>
  </div>
  <div class="card">
    <div class="sec-h">🧾 לפי ימים</div>
    <p class="hint">בעמודת «הוצאות» מקלידים כמה עלו הקניות לאותו שישי — והרווח מתעדכן לבד.</p>

      ${dates.map(dk=>{

function scopeOptionsHtml(sel){
  const t=todayStr();
  const dates=[...new Set(store.orders.map(o=>o.date).filter(Boolean))].sort();
  const countIn=(from,to)=>store.orders.filter(o=>o.date&&o.date>=from&&(!to||o.date<=to)&&!isCancelled(o)).length;
  return `<option value="next7"${sel==='next7'?' selected':''}>📅 השבוע הקרוב (${countIn(t,addDays(t,7))})</option>`+
    `<option value="upcoming"${sel==='upcoming'?' selected':''}>🔜 כל ההזמנות הקרובות (${countIn(t,null)})</option>`+
    dates.map(d=>`<option value="${d}"${d===sel?' selected':''}>${esc(fmtDate(d))} (${store.orders.filter(o=>o.date===d&&!isCancelled(o)).length})</option>`).join('');
}
function validatedStoredMapsUrl(value){
  if(typeof value!=='string'||!value.trim()) return '';
  try{
    const u=new URL(value);
    const h=u.hostname.toLowerCase();
    return u.protocol==='https:'&&(h==='google.com'||h==='www.google.com'||h.endsWith('.google.com'))?u.toString():'';
  }catch(e){ return ''; }
}
function mapsUrl(o){
  const stored=validatedStoredMapsUrl(o.navigationUrl);
  if(stored) return stored;
  const query=String(o.hotelAddress||o.address||o.place||'').trim();
  return query?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query):'';
}
function renderDelivery(){

          ${multi?`<span class="hint"> · ${esc(fmtShort(o.date))}</span>`:''}</span>

function buildRouteText(){
  const sc=summaryScope();
  const dl=sc.list.filter(o=>!o.pickup), pk=sc.list.filter(o=>o.pickup);
  const oweOf2=o=>(o.paid!=='כן'&&o.paid!=='שת"פ')?Math.max(0,parseMoney(o.total)-parseMoney(o.deposit)):0;
  const stopLine=o=>{
    L.push(`${n}. ${sc.multi?fmtShort(o.date)+' · ':''}${o.time?o.time+' — ':''}${o.name} — ${o.place||'—'}${o.address?` (${o.address})`:''}`);
    if(o.phone) L.push(`   📞 ${o.phone}`);
    if(oweOf2(o)>0) L.push(`   💰 לגבות: ${oweOf2(o)}$`);
    if(mapsUrl(o)) L.push(`   🗺️ ${mapsUrl(o)}`);
    L.push('');
  };
  const L=[`🚚 מסלול משלוחים — ${sc.title}`,''];
  const gmap=new Map(), singles=[];
  for(const o of dl){
    const g=(o.group||'').trim();
    if(!g){ singles.push(o); continue; }
    if(!gmap.has(g)) gmap.set(g,[]);
    gmap.get(g).push(o);
  }
  const stops=[...gmap.entries()].map(([g,os])=>({g,os})).concat(singles.map(o=>({o})));
  let n=0;
  for(const s of stops){
    n++;
    if(s.o){ stopLine(s.o); continue; }
    const os=s.os;
    const nav=os.find(o=>o.place);
    const owed=os.reduce((sum,o)=>sum+oweOf2(o),0);
    L.push(`${n}. 👥 ${s.g} — ${os.length} משפחות — ${[...new Set(os.map(o=>o.place).filter(Boolean))].join(' · ')||'—'}${nav&&nav.address?` (${nav.address})`:''}`);
    for(const o of os){
      L.push(`   • ${sc.multi?fmtShort(o.date)+' · ':''}${o.time?o.time+' — ':''}${o.name}${o.phone?` 📞 ${o.phone}`:''}${oweOf2(o)>0?` 💰 ${oweOf2(o)}$`:''}`);
    }
    if(owed>0) L.push(`   💰 סה"כ לגבות בקבוצה: ${owed}$`);
    if(nav&&mapsUrl(nav)) L.push(`   🗺️ ${mapsUrl(nav)}`);
    L.push('');
  }
  if(pk.length){
    L.push('🏠 איסוף עצמי:');
    for(const o of pk) L.push(`  • ${o.name}${o.phone?' — '+o.phone:''}`);
  }
  return L.join('\n');
}

function markBackedUp(){
  store.lastBackup=Date.now(); saveStore();
  if(view.tab==='today') renderToday();
  else if(view.tab==='backup') renderBackup();
}
function exportData(asFile){
  const json=JSON.stringify(store,null,1);
  const fname='batmelech-orders-'+todayStr()+'.json';
  if(!asFile){ copyText(json); markBackedUp(); return; }
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({filename:fname, data:json})
      .then(()=>{ toast('הגיבוי נשמר ✓'); markBackedUp(); })
      .catch(err=>{ if(err&&err.code==='declined') return; toast('השמירה לא הצליחה — אפשר להעתיק כטקסט'); });
    return;
  }
  try{
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},500);
    toast('הגיבוי ירד ✓');
    markBackedUp();
  }catch(e){ toast('השמירה לא הצליחה — אפשר להעתיק כטקסט'); }
}

function saveDraft(){
  if(!draft.date){ toast('חסר תאריך להזמנה 🗓️'); const el=document.querySelector('[data-bind="date"]'); if(el) el.focus(); return; }
  if(!draft.name.trim()){ toast('חסר שם לקוח 👤'); const el=document.querySelector('[data-bind="name"]'); if(el) el.focus(); return; }
  const reservedCustom=(draft.custom||[]).find(c=>c&&isAutomaticChargeName(c.name)&&(Number(c.qty)||0)>0);
  if(reservedCustom){
    toast('אי אפשר לשמור פריט חופשי בשם הזה — הפריט מחושב אוטומטית.');
    const i=draft.custom.indexOf(reservedCustom);
    const el=document.querySelector(`[data-bind="custom-name"][data-i="${i}"]`); if(el) el.focus();
    return;
  }
  const selectedMains=Object.values(draft.mains||{}).reduce((sum,quantity)=>sum+(Number(quantity)||0),0);
  if(selectedMains>(draft.meals||0)){
    toast('בחירת העיקריות חורגת ממנה אחת לכל זוגית — המחיר לחריגה טרם הוגדר.');
    return;
  }
  const selectedSides=Object.values(draft.sides||{}).reduce((sum,quantity)=>sum+(Number(quantity)||0),0);
  if(selectedSides>(draft.meals||0)){
    toast('בחירת התוספות חורגת מתוספת אחת לכל זוגית — המחיר לחריגה טרם הוגדר.');
    return;
  }
  const dessert=dessertAllowance(draft);
  if(dessert.unclassifiedQuantity>0){
    toast('יש קינוח שאי אפשר לשייך בבטחה לזכאות.');
    return;
  }
  if(dessert.excessHalfUnits>0){
    toast('בחירת הקינוחים חורגת מהזכאות — המחיר לחריגה טרם הוגדר.');
    return;
  }
  const suggested=computeSuggested(draft);
  const expectedTotalMinorUnits=calculatedMinorUnits(suggested.total);
  if(expectedTotalMinorUnits===null){
    toast('אי אפשר לחשב מחיר בטוח עד שהמחירון יתוקן.');
    return;
  }
  const totalMinorUnits=parseUsdMinorUnits(draft.total);
  if(String(draft.total??'').trim()===''||totalMinorUnits===null){
    toast('צריך לאשר את המחיר המחושב לפני השמירה.');
    const el=document.querySelector('[data-bind="total"]'); if(el) el.focus();
    return;
  }
  if(totalMinorUnits!==expectedTotalMinorUnits){
    toast('סך התשלום חייב להיות זהה למחיר המחושב.');
    const el=document.querySelector('[data-bind="total"]'); if(el) el.focus();
    return;
  }
  const depositText=String(draft.deposit??'').trim();
  const depositMinorUnits=depositText===''?0:parseUsdMinorUnits(depositText);
  if(depositMinorUnits===null){
    toast('המקדמה אינה תקינה.');
    const el=document.querySelector('[data-bind="deposit"]'); if(el) el.focus();
    return;
  }
  if(depositMinorUnits>expectedTotalMinorUnits){
    toast('המקדמה לא יכולה להיות גבוהה מסך התשלום המחושב.');
    const el=document.querySelector('[data-bind="deposit"]'); if(el) el.focus();
    return;
  }
  if(!draft.id){ draft.id=uid(); store.orders.push(draft); }
  else {
    const i=store.orders.findIndex(o=>o.id===draft.id);
    if(i>=0) store.orders[i]=draft; else store.orders.push(draft);
  }
  saveStore();
  draft=null; view.tab='orders'; render(); toast('ההזמנה נשמרה ✓');
}

document.addEventListener('click', e=>{
  const chkRow=e.target.closest('tr[data-check]');
  if(chkRow&&view.tab==='summary'){
    const sc=summaryScope();
    if(sc.scopeDates.length===1){
      const key=chkRow.dataset.check;
      const dm=prepMap(sc.scopeDates[0]);
      if(dm[key]) delete dm[key]; else dm[key]=true;
      saveStore(); renderSummary();
    }
    return;
  }
  const btn=e.target.closest('[data-act]');
  if(!btn) return;
  const act=btn.dataset.act;
  if(act==='tab'){
    const t=btn.dataset.tab;
    if(t==='form'){ draft=newDraft(); }
    view.tab=t; render(); return;
  }
  if(act==='bump'){
    const g=btn.dataset.group, i=Number(btn.dataset.i), k=btn.dataset.k||null, dd=Number(btn.dataset.d);
    const nv=bump(g,i,k,dd);
    if(g==='lunch'){ renderForm(); return; } // חושף/מסתיר בחירת וריאציה ותוספות
    if(g==='meals'){
      const challahCell=document.querySelector('[data-cell="challot|0"]');
      if(challahCell){ challahCell.textContent=draft.challot||0; challahCell.classList.toggle('has',(draft.challot||0)>0); }
    }
    const cell=document.querySelector(`[data-cell="${g}|${i}${k?'|'+k:''}"]`);
    if(cell){ cell.textContent=nv; cell.classList.toggle('has',nv>0); }
    if(g==='extras'){
      const note=document.querySelector(`[data-note-cell="extras|${i}"]`);
      if(note) note.classList.toggle('hidden',nv===0);
    }
    if(g==='pickup') return;
    refreshFormDerived(); return;
  }
  if(act==='useSuggested'){
    draft.total=btn.dataset.total;
    const el=document.querySelector('[data-bind="total"]'); if(el) el.value=draft.total;
    toast('המחיר עודכן ✓'); return;
  }
  if(act==='importOrder'){
    const ta=$('#importOrderText');
    const val=ta?ta.value:'';
    const p=parseOrderCode(val);
    if(p){
      draft=applyImported(p);
      renderForm();
      toast('הטופס מולא מההזמנה של הלקוח ✓ עכשיו רק לבדוק ולשמור');
      return;
    }
    const f=parseFreeText(val);
    if(f){
      draft=f;
      renderForm();
      toast('קראתי את ההודעה ומילאתי מה שזיהיתי 🙏 לבדוק, להשלים ולשמור — ההודעה המקורית נשמרה בהערות');
      return;
    }
    toast('לא הצלחתי לקרוא את ההודעה — אפשר למלא ידנית');
    return;
  }
  if(act==='addCustom'){ draft.custom.push({name:'',qty:1,price:''}); renderForm(); return; }
  if(act==='delCustom'){ draft.custom.splice(Number(btn.dataset.i),1); renderForm(); return; }
  if(act==='save'){ saveDraft(); return; }
  if(act==='cancel'){
    draft=null; view.tab='orders'; render(); return;
  }
  if(act==='edit'){
    const o=store.orders.find(x=>x.id===btn.dataset.id);
    if(o){ draft=draftFrom(o); view.tab='form'; render(); }
    return;
  }
  if(act==='dup'){
    const o=store.orders.find(x=>x.id===btn.dataset.id);
    if(o){ draft=draftFrom(o); draft.id=null; draft.paid='לא'; draft.deposit=''; view.tab='form'; render(); toast('הועתק — אפשר לערוך ולשמור כהזמנה חדשה'); }
    return;
  }
  if(act==='del'){
    toast('מחיקה הושבתה במערכת הישנה כדי להגן על הזמנות אמיתיות');
    return;
  }
  if(act==='toggleText'){
    const el=document.querySelector(`[data-text-for="${btn.dataset.id}"]`);

  if(act==='daySummary'){ view.tab='summary'; view.summaryDate=btn.dataset.date; render(); return; }
  if(act==='clearSearch'){

  if(act==='print'){ window.print(); return; }

  if(act==='lbBump'){

    if(cell){ cell.textContent=nv; cell.classList.toggle('has',nv>0); }

    if(pv) pv.innerHTML=labelsHtml(summaryScope().list);
    return;
  }
  if(act==='jump'){

    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(act==='copyRoute'){ copyText(buildRouteText()); return; }
  if(act==='sendRoute'){
    const t=buildRouteText();
    copyText(t);
    window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
    return;
  }
  if(act==='toggleOut'){
    const name=OUT_POOL[Number(btn.dataset.i)];
    const out=store.settings.out;
    const idx=out.indexOf(name);
    if(idx>=0) out.splice(idx,1); else out.push(name);
    saveStore(); renderBackup(); return;
  }
  if(act==='menuDel'){
    toast('עריכת התפריט זמינה במערכת החדשה בלבד כדי לשמור התאמה לטופס הלקוחות');
    return;
  }
  if(act==='menuAdd'){
    toast('עריכת התפריט זמינה במערכת החדשה בלבד כדי לשמור התאמה לטופס הלקוחות');
    return;
  }
  if(act==='introSeen'){ store.introSeen=true; saveStore(); renderToday(); return; }
  if(act==='menuReset'){
    toast('איפוס התפריט הושבת כדי לא לפגוע ברשימות ההכנה והקניות');
    return;
  }
  if(act==='promoMsg'){
    const t=buildPromoText();
    copyText(t);
    window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
    return;
  }
  if(act==='custVip'){
    const key=btn.dataset.key;
    const m=store.customerMeta[key]||(store.customerMeta[key]={});
    m.vip=!m.vip;
    saveStore(); renderCustomersList(); return;
  }
  if(act==='printLabels'){
    const html=labelsHtml(summaryScope().list);
    if(html.includes('labels-grid')) printHtml(html,'labels');
    else toast('אין מדבקות להדפסה — כל הכמויות על 0');
    return;
  }
  if(act==='exportFile'){ exportData(true); return; }
  if(act==='exportCopy'){ exportData(false); return; }
});

function handleBind(e){

  if(b==='moneyMonth'){ view.moneyMonth=e.target.value; renderMoney(); return; }

    const dk=e.target.dataset.date;
    const n=parseMoney(e.target.value);
    if(n>0) store.expenses[dk]=n; else delete store.expenses[dk];
    saveStore();
    if(e.type==='change') renderMoney();
    return;
  }
  if(b==='menu-num'||b==='menu-extra-price'||b==='lunch-price'){
    if(e.type==='change'){
      toast('מחירי התפריט נעולים עד שטופס הלקוחות יקבל את אותו מחירון');
      renderBackup();
    }
    return;
  }
  if(b==='payLink'){ store.settings.payLink=e.target.value.trim(); saveStore(); return; }
  if(b==='orderFormUrl'){ store.settings.orderFormUrl=e.target.value.trim(); saveStore(); return; }
  if(b==='custNote'){
    const key=e.target.dataset.key;
    const m=store.customerMeta[key]||(store.customerMeta[key]={});
    m.notes=e.target.value;
    saveStore(); return;
  }
  if(b==='maxMeals'){
    store.settings.maxMeals=Math.max(0,parseInt(e.target.value,10)||0);
    saveStore(); return;
  }
  if(!draft) return;
  const v=e.target.value;
  const i=Number(e.target.dataset.i);
  switch(b){
    case 'date': draft.date=v; updatePriceHint(); break;
    case 'name': draft.name=v; break;
    case 'phone': draft.phone=v; break;
    case 'place': {
      draft.place=v;
      const h=HOTELS.find(x=>x.name===v.trim());
      if(h&&!draft.address){
        draft.address=h.addr;
        const a=document.querySelector('[data-bind="address"]'); if(a) a.value=h.addr;
      }
      break;
    }
    case 'address': draft.address=v; break;
    case 'group': draft.group=v.trim(); break;
    case 'time': draft.time=v; break;
    case 'status': draft.status=v; break;
    case 'pickup': {
      draft.pickup=e.target.checked;
      const df=$('#deliveryFields'); if(df) df.hidden=draft.pickup;
      updatePriceHint();
      break;
    }
    case 'heat': draft.heat=v; break;
    case 'firstsNote': draft.firstsNote=v; break;
    case 'mainsNote': draft.mainsNote=v; break;
    case 'notes': draft.notes=v; break;
    case 'total': draft.total=v; break;
    case 'deposit': draft.deposit=v; break;
    case 'payMethod': draft.payMethod=v; break;
    case 'paid': draft.paid=v; break;
    case 'extra-note': {
      const name=MENU.extras[i].name;
      const ex=draft.extras[name]||(draft.extras[name]={q:0,note:''});
      ex.note=v;
      if(ex.q===0&&!ex.note) delete draft.extras[name];
      break;
    }
    case 'lunch-variant': {
      const it=MENU.lunch[i];
      if(it&&it.variants){
        const e=draft.lunch[it.key]||(draft.lunch[it.key]={q:0,v:'',sides:{},addon:0});
        e.v=v; updatePriceHint();
      }
      break;
    }
    case 'custom-name': if(draft.custom[i]){ draft.custom[i].name=v; updatePriceHint(); } break;
    case 'custom-note': if(draft.custom[i]) draft.custom[i].note=v; break;
    case 'custom-qty': if(draft.custom[i]){ draft.custom[i].qty=v; updatePriceHint(); } break;
    case 'custom-price': if(draft.custom[i]){ draft.custom[i].price=v; updatePriceHint(); } break;
  }
}
document.addEventListener('input', handleBind);
document.addEventListener('change', e=>{
  if(e.target.type==='checkbox'||e.target.type==='radio'||e.target.tagName==='SELECT'||e.target.type==='date'||e.target.dataset.bind==='expense') handleBind(e);
});

/* ================= init ================= */
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');
loadStore();
buildMenu();
render();
</script>

</body>
</html>
