<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="מטעמי בת מלך — מטבח ביתי אותנטי להזמנות שבת וצהריים בדובאי.">
  <meta name="robots" content="index, follow">
  <title>מטעמי בת מלך · בקרוב</title>
  <style>
    :root{font-family:"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;color:#4a2c2a;background:#fff8f7}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#f8dce3 0,transparent 35%),#fff8f7}
    main{max-width:760px;margin:0 auto;padding:72px 24px 48px;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 22px;border-radius:20px;background:#b0446b;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;box-shadow:0 14px 32px #b0446b2e}
    h1{margin:0;color:#5a3033;font-size:clamp(2.2rem,7vw,4.5rem);line-height:1.05;letter-spacing:-.04em}
    .eyebrow{margin:0 0 16px;color:#b0446b;font-weight:800;letter-spacing:.08em}
    p{max-width:560px;margin:22px auto;color:#8a6268;font-size:1.12rem;line-height:1.8}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 28px;border-radius:16px;background:#b0446b;color:#fff;text-decoration:none;font-weight:900;box-shadow:0 12px 26px #b0446b38}
    a:hover{filter:brightness(1.06)} .note{margin-top:34px;font-size:.9rem;color:#a3838a}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ב</div>
    <p class="eyebrow">מטבח ביתי אותנטי · דובאי</p>
    <h1>מטעמי בת מלך</h1>
    <p>אנחנו מכינים אוכל ביתי לשבת, לאירוח ולצהריים באמצע השבוע. ההזמנות נפתחות בקרוב.</p>
    <a href="/new-order">להזמנה ולבחירת מנות</a>
    <p class="note">המחיר הסופי והזמינות מאושרים מולנו בוואטסאפ.</p>
  </main>
</body>
</html>
